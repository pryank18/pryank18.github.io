function computeAutonomyScore(){
  const trackedDispatches = deliveries.filter(d=> d.aiRecommendedFollowed!==null && d.aiRecommendedFollowed!==undefined);
  const followedCount = trackedDispatches.filter(d=>d.aiRecommendedFollowed).length;
  const dispatchPct = trackedDispatches.length ? Math.round((followedCount/trackedDispatches.length)*100) : null;

  const forecastPOs = purchaseOrders.filter(p=>p.fromForecast).length;
  const poPct = purchaseOrders.length ? Math.round((forecastPOs/purchaseOrders.length)*100) : null;

  const selfServeOrders = deliveries.filter(d=>d.customerRequested).length;
  const selfServePct = deliveries.length ? Math.round((selfServeOrders/deliveries.length)*100) : null;

  return { dispatchPct, poPct, selfServePct, trackedDispatches: trackedDispatches.length, forecastPOs, selfServeOrders };
}
/* ---- Bulk/Retail breakdown sections — the actual point of the two-lens split.
   Bulk lens shows the commercial channel mix (Direct B2B vs Agent); Retail lens shows
   the station network by ownership model plus estimated true network volume, since a
   DODO owner can legally buy from a competitor and Retail's KPI is the station's real
   throughput, not just what we happened to ship them. ---- */
function channelMixHTML(clients, invoices){
  const byChannel = { direct:{rev:0,vol:0,accounts:0}, agent:{rev:0,vol:0,accounts:0} };
  clients.forEach(c=>{
    const ch = c.channel || 'direct';
    if(!byChannel[ch]) return;
    byChannel[ch].accounts++;
  });
  invoices.forEach(i=>{
    const c = clientById(i.client);
    const ch = c?.channel || 'direct';
    if(!byChannel[ch]) return;
    byChannel[ch].rev += i.amount;
    byChannel[ch].vol += i.qty;
  });
  const maxRev = Math.max(byChannel.direct.rev, byChannel.agent.rev, 1);
  return `
    <div class="section-title" style="--sc2:var(--orange);">${t('sectionChannelMix')}</div>
    <div class="card" style="margin-bottom:26px;">
      <div class="muted" style="margin-bottom:14px; max-width:600px;">${t('channelMixNote')}</div>
      ${['direct','agent'].map(ch=>{
        const d = byChannel[ch];
        return `
          <div class="list-row">
            <div>

function retailNetworkHTML(clients){
  const byOwnership = { COCO:{count:0,ours:0}, CODO:{count:0,ours:0}, DODO:{count:0,ours:0,totalEst:0,externalEst:0} };
  let loggedExternalTotal = 0;
  clients.forEach(c=>{
    const o = c.ownership;
    if(!byOwnership[o]) return;
    byOwnership[o].count++;
    byOwnership[o].ours += (c.delivered||0);
    if(o==='DODO'){
      const nv = estimatedNetworkVolume(c);
      byOwnership[o].totalEst += nv.totalEstimate;
      byOwnership[o].externalEst += nv.externalEstimate;
    }
    loggedExternalTotal += loggedExternalSupply(c.id).reduce((s,e)=>s+e.qty,0);
  });
  const networkTotal = byOwnership.COCO.ours + byOwnership.CODO.ours + byOwnership.DODO.totalEst;
  const ourShareOfNetwork = networkTotal>0 ? Math.round(((byOwnership.COCO.ours+byOwnership.CODO.ours+byOwnership.DODO.ours)/networkTotal)*100) : 100;
  return `
    <div class="section-title" style="--sc2:var(--violet);">${t('sectionRetailNetwork')}</div>
    <div class="card" style="margin-bottom:26px;">
      <div class="muted" style="margin-bottom:14px; max-width:640px;">${t('retailNetworkNote')}</div>
      <div class="grid grid-3" style="margin-bottom:16px;">
        ${['COCO','CODO','DODO'].map(o=>`
          <div>
            <div class="autonomy-pct" style="font-size:22px;"><span class="ownership-badge ${o}">${o}</span></div>
            <div class="muted" style="font-size:11.5px; margin-top:6px;">${t('stationsCount',{n:byOwnership[o].count})}</div>
            <div class="mono" style="font-weight:600; margin-top:2px;">${fmt(byOwnership[o].ours)} L</div>
          </div>
        `).join('')}
      </div>
      ${byOwnership.DODO.externalEst>0 ? `
        <div class="list-row">
          <div class="lr-main">${t('estNetworkVolume')}</div>
          <div class="mono" style="font-weight:600;">${fmt(networkTotal)} L</div>
        </div>
        <div class="list-row">
          <div class="lr-main">${t('estExternalVolume')}</div>
          <div class="mono" style="font-weight:600; color:var(--amber);">${fmt(byOwnership.DODO.externalEst)} L</div>
        </div>
        <div class="list-row">
          <div class="lr-main">${t('ourNetworkShare')}</div>
          <div class="mono" style="font-weight:700; color:${ourShareOfNetwork>=80?'var(--green)':ourShareOfNetwork>=60?'var(--amber)':'var(--red)'}">${ourShareOfNetwork}%</div>
        </div>
      ` : `<div class="muted">${t('noDodoShareData')}</div>`}
      ${loggedExternalTotal>0 ? `
        <div class="list-row" style="border-top:1px solid var(--border-soft); margin-top:6px; padding-top:12px;">
          <div class="lr-main">${t('loggedExternalLabel')}</div>
          <div class="mono" style="font-weight:600;">${fmt(loggedExternalTotal)} L</div>
        </div>
      ` : ''}
    </div>
  `;
}
function viewExecutive(){
  const clients = visibleClients().filter(c=> businessUnitMatches(c.type));
  const clientIds = new Set(clients.map(c=>c.id));
  const invoices = visibleInvoicesList().filter(i=> clientIds.has(i.client));
  const deliveries = visibleDeliveriesList().filter(d=> clientIds.has(d.client));
  const totalRevenue = invoices.reduce((s,i)=> s+i.amount, 0);
  const totalCollected = invoices.filter(i=>i.status==='paid').reduce((s,i)=> s+i.amount, 0);
  const totalOutstanding = invoices.filter(i=>invoiceStatusDisplay(i)!=='paid').reduce((s,i)=> s+i.amount, 0);
  const totalCost = invoices.reduce((s,i)=> s + i.qty*(COST_PRICES[deliveries.find(d=>d.id===i.delivery)?.product]||0.9), 0);
  const grossMargin = totalRevenue>0 ? ((totalRevenue-totalCost)/totalRevenue)*100 : 0;

  const revenueByDepot = {};
  invoices.forEach(i=>{
    const d = deliveries.find(x=>x.id===i.delivery);
    if(d){ revenueByDepot[d.depot] = (revenueByDepot[d.depot]||0) + i.amount; }
  });
  const depotRanking = Object.entries(revenueByDepot).map(([depotId,rev])=>({ depot:depotById(depotId), rev }))
    .filter(x=>x.depot).sort((a,b)=>b.rev-a.rev);
  const maxDepotRev = Math.max(...depotRanking.map(x=>x.rev), 1);

  const marginByProduct = {};
  invoices.forEach(i=>{
    const d = deliveries.find(x=>x.id===i.delivery);
    if(!d) return;
    const cost = i.qty * (COST_PRICES[d.product]||0.9);
    if(!marginByProduct[d.product]) marginByProduct[d.product] = { rev:0, cost:0 };
    marginByProduct[d.product].rev += i.amount;
    marginByProduct[d.product].cost += cost;
  });

  const cleanDeliveries = deliveries.filter(d=>d.status==='delivered' && d.deliveredQty!=null);
  const slaClean = cleanDeliveries.filter(d=> ((d.qty-d.deliveredQty)/d.qty)*100 <= 1.5).length;

  return `

      <div class="card stat-card" style="--sc:var(--green)">

      <div class="card stat-card" style="--sc:${slaPct>=95?'var(--green)':slaPct>=85?'var(--amber)':'var(--red)'}">

    <div class="grid grid-2" style="margin-top:26px;">

        <div class="card">
          ${depotRanking.length===0 ? `<div class="muted">${t('noRevenueYet')}</div>` :

/* ============================= RECONCILIATION (Theft/Pilferage Control) ============================= */
function viewReconciliation(){
  const deliveries = visibleDeliveriesList();
  const purchaseOrders = visiblePurchaseOrdersList();
  const receivedPOs = purchaseOrders.filter(p=> p.status==='received' && p.upliftedQty!=null)
    .sort((a,b)=> (b.receivedDate||'').localeCompare(a.receivedDate||''));
  const totalBooked = receivedPOs.reduce((s,p)=> s+p.qty, 0);
  const totalUplifted = receivedPOs.reduce((s,p)=> s+p.upliftedQty, 0);
  const totalSupplyVariance = totalBooked - totalUplifted;
  const supplyVariancePct = totalBooked ? (totalSupplyVariance/totalBooked)*100 : 0;
  const outstandingShortLifts = receivedPOs.filter(p=> p.pendingQty>0);

  const delivered = deliveries.filter(d=> d.status==='delivered' && d.deliveredQty!=null)
    .sort((a,b)=> b.date.localeCompare(a.date));
  const totalDispatched = delivered.reduce((s,d)=> s+d.qty, 0);
  const totalDelivered = delivered.reduce((s,d)=> s+d.deliveredQty, 0);
  const totalVariance = totalDispatched - totalDelivered;
  const variancePct = totalDispatched ? (totalVariance/totalDispatched)*100 : 0;
  const flagged = delivered.filter(d=> ((d.qty - d.deliveredQty)/d.qty)*100 > 1.5);

  return `
    <div class="muted" style="margin-bottom:16px; max-width:680px;">${t('reconciliationIntro')}</div>

    <div class="section-title" style="--sc2:var(--amber); margin-top:0;">${t('sectionSupplyRecon')}</div>

        <div class="stat-label">${t('statSupplyVariance')}</div>
        <div class="stat-value mono">${supplyVariancePct.toFixed(2)}%</div>
        <div class="stat-sub">${fmt(totalSupplyVariance)} L</div>
      </div>
      <div class="card stat-card" style="--sc:${outstandingShortLifts.length?'var(--red)':'var(--green)'}">
        <div class="stat-label">${t('statOutstandingShortLifts')}</div>
        <div class="stat-value mono">${outstandingShortLifts.length}</div>
        <div class="stat-sub">${t('supplyReviewThreshold')}</div>
      </div>
    </div>
    <div class="card" style="padding:0; margin-bottom:26px;">
      <table>
        <thead><tr><th>${t('thPo')}</th><th>${t('thSupplier')}</th><th>${t('thDepotCol')}</th><th>${t('fieldBookedQty')}</th><th>${t('fieldUpliftedQty')}</th><th>${t('thVariance')}</th><th>${t('thStatus')}</th></tr></thead>
        <tbody>
          ${receivedPOs.length===0 ? `<tr><td colspan="7" class="muted" style="padding:20px; text-align:center;">${t('noReceivedPOs')}</td></tr>` :
            receivedPOs.map(p=>{
              const sup = suppliers.find(s=>s.id===p.supplier);
              const varPct = p.qty ? ((p.qty-p.upliftedQty)/p.qty)*100 : 0;
              const short = p.pendingQty>0;
              return `<tr>
                <td class="id-cell">${p.id}</td>
                <td>${sup?sup.name:'—'}</td>
                <td>${depotById(p.depot)?.name||'—'}</td>
                <td class="mono">${fmt(p.qty)} L</td>

            const inv = invoices.find(i=> i.delivery===d.id);

/* ============================= SUPPORT ============================= */
function slaStatus(ticket){
  if(ticket.status==='resolved') return 'ok';
  const created = new Date(ticket.createdAt);
  const deadline = new Date(created.getTime() + ticket.slaHours*3600000);
  return NOW_DATETIME > deadline ? 'breach' : 'ok';
}
const TIER2_AGENT = 'K. Banda (Tier 2)';
function applyEscalations(){
  tickets.forEach(tk=>{
    if(tk.status!=='resolved' && slaStatus(tk)==='breach' && !tk.escalated){
      tk.escalated = true;
      tk.priority = 'high';
      tk.agent = TIER2_AGENT;
      logActivity('ticket', t('logTicketEscalated',{id:tk.id}));
    }
  });
}
function resolveTicket(id){
  if(!canManageSupport()){ denyPermission(); return; }
  const tk = tickets.find(x=>x.id===id);
  if(tk) tk.status = 'resolved';
  renderAll();
  showToast(t('toastTicketResolved',{id}), 'success');
  logActivity('ticket', t('logTicketResolved',{id}));
}
function resolveSelectedTickets(){
  if(!canManageSupport()){ denyPermission(); return; }
  if(selectedTickets.size===0) return;
  if(!confirm(t('confirmBulkResolve',{n:selectedTickets.size}))) return;
  selectedTickets.forEach(id=>{
    const tk = tickets.find(x=>x.id===id);
    if(tk && tk.status!=='resolved'){ tk.status='resolved'; logActivity('ticket', t('logTicketResolved',{id})); }
  });
  selectedTickets.clear();
  renderAll();
  showToast(t('toastBulkResolved'), 'success');
}

  if(checked) selectedTickets.add(id); else selectedTickets.delete(id);

function toggleAllTickets(checked){
  const open = tickets.filter(tk=>tk.status!=='resolved').map(tk=>tk.id);

/* ---- Voice input: real browser SpeechRecognition API, feature-detected ---- */
let voiceRecognition = null;
let voiceListening = false;
function initVoiceInputButton(){
  const micBtn = document.getElementById('aiMicBtn');
  if(!micBtn) return;
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionCtor){
    micBtn.style.display = 'none'; // not supported in this browser — hide rather than show a dead button
    return;
  }
  micBtn.style.display = 'flex';
  micBtn.title = t('voiceInputTitle');
}
function toggleVoiceInput(){
  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognitionCtor) return; // defensive — button is hidden when unsupported, but guard anyway
  const micBtn = document.getElementById('aiMicBtn');
  if(voiceListening){
    if(voiceRecognition) voiceRecognition.stop();
    return;
  }
  voiceRecognition = new SpeechRecognitionCtor();
  voiceRecognition.lang = LOCALE_MAP[currentLang] || 'en-US';
  voiceRecognition.interimResults = false;
  voiceRecognition.maxAlternatives = 1;
  voiceRecognition.onstart = () => {
    voiceListening = true;
    micBtn.classList.add('listening');
  };
  voiceRecognition.onresult = (evt) => {
    const transcript = evt.results[0][0].transcript;
    document.getElementById('aiInput').value = transcript;
  };
  voiceRecognition.onerror = () => {
    showToast(t('voiceInputError'), 'info');
  };
  voiceRecognition.onend = () => {
    voiceListening = false;
    micBtn.classList.remove('listening');
  };
  try{ voiceRecognition.start(); }
  catch(e){ showToast(t('voiceInputError'), 'info'); }
}

function buildAiContext(){
  const lows = lowStockTanks().map(l=> `${l.tank.product} at ${l.depot.name}: ${l.tank.level}L of ${l.tank.capacity}L (reorder at ${l.tank.reorder}L)`);
  const activeDel = deliveries.filter(d=>d.status!=='delivered' && d.status!=='cancelled').map(d=>{
    const c = clientById(d.client); const v = d.vehicle? vehicleById(d.vehicle): null;
    return `${d.id}: ${d.qty}L ${d.product} to ${c?.name} (${c?.type}), status ${d.status}${v? ', vehicle '+v.plate : ''}${d.status==='transit'? ', '+Math.round(d.progress||0)+'% of route':''}`;
  });
  const idleVehicles = fleet.filter(f=>f.status==='idle').map(v=> `${v.plate} (${v.driver}) at ${depotById(v.depot)?.name}, compartments ${v.compartments.join('+')}L`);
  const serviceVehicles = fleet.filter(f=>f.status==='service').map(v=> `${v.plate} (${v.driver}), last service ${v.lastService}`);
  const overdueInv = invoices.filter(i=>invoiceStatusDisplay(i)==='overdue').map(i=>{
    const c = clientById(i.client); return `${i.id}: $${i.amount} owed by ${c?.name}, was due ${i.dueDate}`;
  });
  const topClients = [...clients].sort((a,b)=>b.delivered-a.delivered).slice(0,5).map(c=> `${c.name} (${c.type}, ${c.location}): ${c.delivered}L delivered lifetime, terms ${c.terms}`);

  // Risk signals computed by real logic (trend-based forecast, rule-based credit check,
  // quality holds, SLA timers) — the AI narrates these, it doesn't invent them.
  const stockoutRisks = [];
  depots.forEach(dep=> dep.tanks.forEach(tk=>{
    const f = forecastForTank(dep.id, tk.product);
    if(f && f.daysToStockout!=null && f.daysToStockout<=14){
      stockoutRisks.push(`${tk.product} at ${dep.name}: ~${f.daysToStockout} days to stockout at current consumption rate`);
    }
  }));
  const qualityHolds = [];
  depots.forEach(dep=> dep.tanks.forEach(tk=>{ if(tk.qualityHold) qualityHolds.push(`${tk.product} at ${dep.name} is on quality hold, dispatch blocked`); }));
  const creditRisks = clients.filter(c=> creditRiskLevel(c.id)==='high').map(c=> `${c.name}: over credit limit (${money(outstandingBalance(c.id))} of ${money(c.creditLimit)})`);
  const slaBreaches = tickets.filter(tk=>tk.status!=='resolved' && slaStatus(tk)==='breach').map(tk=> `${tk.id}: "${tk.subject}" breached SLA, escalated: ${tk.escalated}`);
  const expiringLicenses = licenses.filter(l=>daysUntil(l.expiry)<=30).map(l=> `${l.name} at ${depotById(l.depot)?.name} expires in ${daysUntil(l.expiry)} days`);
  const pendingPOs = purchaseOrders.filter(p=>p.status==='pending_approval').map(p=> `${p.id}: ${p.qty}L ${p.product} from ${suppliers.find(s=>s.id===p.supplier)?.name}, awaiting approval`);

  return [
    `Today's date: ${TODAY}.`,
    `Depots and low-stock tanks:`, lows.length? lows.join('; ') : 'no tanks currently below reorder level',
    `Stockout risk (trend-based projection, not ML):`, stockoutRisks.length? stockoutRisks.join('; ') : 'no tank projected to run out within 14 days',
    `Quality holds blocking dispatch:`, qualityHolds.length? qualityHolds.join('; ') : 'none active',
    `Clients over their credit limit:`, creditRisks.length? creditRisks.join('; ') : 'none over limit',
    `Support tickets that breached SLA:`, slaBreaches.length? slaBreaches.join('; ') : 'none breached',
    `Licenses/permits expiring within 30 days:`, expiringLicenses.length? expiringLicenses.join('; ') : 'none expiring soon',
    `Purchase orders awaiting approval:`, pendingPOs.length? pendingPOs.join('; ') : 'none pending',
    `Active delivery orders:`, activeDel.length? activeDel.join('; ') : 'no open orders',
    `Idle fleet vehicles:`, idleVehicles.length? idleVehicles.join('; ') : 'none idle',
    `Vehicles in service/maintenance:`, serviceVehicles.length? serviceVehicles.join('; ') : 'none in service',
    `Overdue invoices:`, overdueInv.length? overdueInv.join('; ') : 'none overdue',
    `Top clients by lifetime volume:`, topClients.join('; '),
  ].join('\n');
}

/* ---- AI Command Center: proactive briefing on the Dashboard, not buried in chat ---- */
let dailyBriefing = { text:null, loading:false, error:null, generatedAt:null };
async function generateDailyBriefing(){
  if(dailyBriefing.loading) return;
  dailyBriefing = { text:null, loading:true, error:null, generatedAt:null };
  if(currentView==='dashboard') document.getElementById('view').innerHTML = viewDashboard();
  try{
    const systemPrompt = `You are the AI command center for Depotline, a fuel operations platform. Generate a short executive briefing (4-6 lines max) from the live risk data below. Lead with the single most urgent item. Use a 🔴/🟡/🟢 marker per line based on severity. Be specific — name the depot, client, or ticket. No preamble, no sign-off, just the briefing lines. ${aiLanguageInstruction()}\n\nLIVE DATA:\n${buildAiContext()}`;
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 400, system: systemPrompt, messages: [{role:'user', content:"Generate today's briefing."}] })
    });
    const data = await response.json();
    const text = (data.content || []).map(b=>b.text||'').join('\n').trim();
    dailyBriefing = { text: text || null, loading:false, error: text? null : 'empty', generatedAt: nowTime() };
  }catch(e){
    dailyBriefing = { text:null, loading:false, error:'network', generatedAt:null };
  }
  if(currentView==='dashboard') document.getElementById('view').innerHTML = viewDashboard();
}

  body.scrollTop = body.scrollHeight;
}

async function sendAiMessage(preset){
  if(aiBusy) return;
  const input = document.getElementById('aiInput');
  const text = (preset !== undefined ? preset : input.value).trim();
  if(!text) return;
  input.value = '';
  aiMessages.push({role:'user', content: escapeHtml(text), raw: text});
  renderAiBody();

  aiBusy = true;
  document.getElementById('aiSendBtn').disabled = true;
  const body = document.getElementById('aiBody');
  const typing = document.createElement('div');
  typing.className = 'ai-typing';
  typing.id = 'aiTyping';
  typing.innerHTML = '<span></span><span></span><span></span>';
  body.appendChild(typing);
  body.scrollTop = body.scrollHeight;

  try{
    const systemPrompt = `You are the operations assistant embedded in Depotline, a global fuel delivery management platform used by fuel depots, industrial sites and retail stations worldwide. Answer using the live data below. Be concise (2-4 sentences unless a list is clearly needed), use litres (L) and dollar amounts as given, and speak like a knowledgeable operations manager — practical, no fluff. ${aiLanguageInstruction()} This applies regardless of the language of the data below.\n\nLIVE DATA:\n${buildAiContext()}`;
    const history = aiMessages.slice(-8).map(m=> ({ role: m.role, content: m.raw || m.content }));
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: history,
      })
    });
    const data = await response.json();
    const replyText = (data.content || []).map(b=> b.text || '').join('\n').trim() || "I couldn't generate a response for that — try rephrasing.";
    document.getElementById('aiTyping')?.remove();
    aiMessages.push({role:'assistant', content: escapeHtml(replyText).replace(/\n/g,'<br>'), raw: replyText});
  }catch(err){
    document.getElementById('aiTyping')?.remove();
    aiMessages.push({role:'assistant', content: t('aiUnavailable'), error:true});
  }
  aiBusy = false;
  document.getElementById('aiSendBtn').disabled = false;
  renderAiBody();
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

/* ============================= CSV EXPORT ============================= */
function csvCell(v){
  const s = String(v==null? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
}
function exportCsv(filename, headers, rows){
  const lines = [headers.map(csvCell).join(',')].concat(rows.map(r=> r.map(csvCell).join(',')));
  const blob = new Blob([lines.join('\n')], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(t('toastExported',{file:filename}), 'success');
}

/* ============================= CLOCK ============================= */
function tickClock(){
  const now = new Date();
  const locale = LOCALE_MAP[currentLang] || 'en-US';
  document.getElementById('clockTime').textContent = now.toLocaleTimeString(locale);
  document.getElementById('clockDate').textContent = now.toLocaleDateString(locale, {weekday:'short', year:'numeric', month:'short', day:'numeric'});
}
setInterval(tickClock, 1000);
tickClock();

/* ============================= INIT ============================= */
const restoredSession = loadState();
if(!themeManuallySet){ currentTheme = getTimeBasedTheme(); } // no saved preference — pick by time of day
document.documentElement.setAttribute('data-theme', currentTheme);
document.documentElement.lang = currentLang;
document.documentElement.dir = (currentLang==='ar') ? 'rtl' : 'ltr';
renderStaticText();
renderAll();
if(restoredSession) showToast(t('toastSessionRestored'), 'info');
</script>
