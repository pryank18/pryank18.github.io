<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Depotline — Global Fuel Operations Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0: #0B1220;
    --bg-1: #101A32;
    --surface: #15203C;
    --surface-2: #1B2846;
    --border: #2A3760;
    --border-soft: #212D52;
    --text: #EEF1F8;
    --text-dim: #8D97B8;
    --text-faint: #545E80;

    --blue: #3B82F6;
    --teal: #14B8A6;
    --green: #22C55E;
    --amber: #F59E0B;
    --orange: #FB923C;
    --red: #EF4444;
    --violet: #8B5CF6;
    --indigo: #6366F1;
    --gold: #D4A537;
  }

  :root[data-theme="light"]{
    --bg-0: #F3F5F9;
    --bg-1: #FFFFFF;
    --surface: #FFFFFF;
    --surface-2: #EEF1F7;
    --border: #DBE0EB;
    --border-soft: #E6E9F2;
    --text: #16203A;
    --text-dim: #5B6685;
    --text-faint: #8993AE;
    --blue: #2563EB; --teal: #0D9488; --green: #16A34A; --amber: #D97706;
    --orange: #EA580C; --red: #DC2626; --violet: #7C3AED; --indigo: #4F46E5; --gold: #A9791F;
  }
  :root[data-theme="contrast"]{
    --bg-0: #000000;
    --bg-1: #0A0A0A;
    --surface: #111214;
    --surface-2: #1B1D21;
    --border: #3D4046;
    --border-soft: #2A2C31;
    --text: #FFFFFF;
    --text-dim: #D6D9E0;
    --text-faint: #9AA0AD;
    --blue: #5B9BFF; --teal: #2DEBD3; --green: #4ADE80; --amber: #FBBF24;
    --orange: #FF8A4C; --red: #FF5C5C; --violet: #B794F6; --indigo: #8B93FF; --gold: #FFD166;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(circle at 10% 0%, color-mix(in srgb, var(--blue) 7%, transparent), transparent 42%),
      radial-gradient(circle at 92% 6%, color-mix(in srgb, var(--teal) 6%, transparent), transparent 40%),
      var(--bg-0);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    height: 100vh;
    overflow: hidden;
  }
  .mono{ font-family:'JetBrains Mono', monospace; }
  .display{ font-family:'Manrope', sans-serif; }

  #app{ display:flex; height:100vh; }

  #sidebar{
    width: 232px; flex-shrink:0;
    background: linear-gradient(180deg, var(--bg-1), var(--bg-0));
    border-right: 1px solid var(--border-soft);
    display:flex; flex-direction:column; padding: 18px 0;
  }
  .brand{ padding: 0 20px 16px 20px; border-bottom: 1px solid var(--border-soft); margin-bottom: 10px; }
  .brand-mark{ display:flex; align-items:center; gap:10px; }
  .brand-icon{
    width:32px; height:32px; border-radius:9px; flex-shrink:0;
    background: linear-gradient(135deg, var(--blue), var(--teal));
    display:flex; align-items:center; justify-content:center;
  }
  .brand-icon svg{ width:16px; height:16px; color:#fff; }
  .brand-mark .name{ font-family:'Manrope',sans-serif; font-weight:800; font-size:19px; letter-spacing:-0.01em; color:var(--text); }
  .brand-sub{ font-size:11px; color:var(--text-faint); margin-top:6px; line-height:1.4; }
  .demo-pill{
    display:inline-flex; align-items:center; gap:5px; margin-top:9px;
    font-size:10px; font-weight:700; letter-spacing:0.03em; color: var(--gold);
    background: color-mix(in srgb, var(--gold) 12%, transparent); border:1px solid color-mix(in srgb, var(--gold) 30%, transparent);
    padding:3px 8px; border-radius:20px;
  }
  .demo-pill .dp-dot{ width:5px; height:5px; border-radius:50%; background: var(--gold); }

  nav{ display:flex; flex-direction:column; gap:2px; padding: 0 10px; overflow-y:auto; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding: 9px 12px; border-radius: 8px;
    color: var(--text-dim); cursor:pointer; font-size: 13px; font-weight: 600;
    border: 1px solid transparent; transition: all .15s ease;
  }
  .nav-item svg{ width:15px; height:15px; flex-shrink:0; }
  .nav-item:hover{ background: var(--surface-2); color: var(--text); }
  .nav-item.active{
    color: var(--text); background: var(--surface-2);
    border-color: color-mix(in srgb, var(--nc) 40%, transparent);
    box-shadow: inset 2px 0 0 var(--nc);
  }
  .nav-item.active svg{ color: var(--nc); }
  .nav-item:not(.active) svg{ color: var(--text-faint); }
  .nav-count{
    margin-left:auto; font-family:'JetBrains Mono',monospace; font-size:10px; font-weight:600;
    color: var(--bg-0); background: var(--nc); padding:1.5px 6px; border-radius:8px;
  }
  .nav-item:not(.active) .nav-count{ background: var(--surface-2); color: var(--text-dim); }
  .nav-group-label{ font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-faint); padding:14px 12px 6px 12px; }
  .nav-group-label:first-child{ padding-top:2px; }

  .sidebar-foot{ margin-top:auto; padding: 14px 20px 0 20px; border-top:1px solid var(--border-soft); }
  .lang-select{
    width:100%; background: var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:7px 9px; border-radius:7px; font-family:'Inter',sans-serif; font-size:12px; margin-bottom:12px; cursor:pointer;
  }
  .clock{ font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text); font-weight:600; }
  .clock .date{ color:var(--text-faint); font-size:10px; margin-top:2px; font-weight:400; }
  .reset-link{
    display:flex; align-items:center; gap:6px; margin-top:12px; background:none; border:none;
    color:var(--text-faint); font-size:11px; cursor:pointer; padding:0; font-family:'Inter',sans-serif;
  }
  .reset-link:hover{ color:var(--text-dim); }
  .reset-link svg{ width:12px; height:12px; }

  #main{ flex:1; display:flex; flex-direction:column; overflow:hidden; position:relative; }
  #topbar{
    height:56px; flex-shrink:0; border-bottom:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:space-between; padding: 0 26px;
  }
  .topbar-left{ display:flex; align-items:center; gap:12px; }
  #topbar h1{ font-family:'Manrope',sans-serif; font-size:18px; font-weight:700; letter-spacing:-0.01em; }
  .topbar-demo{
    display:flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; color: var(--gold);
    background: color-mix(in srgb, var(--gold) 10%, transparent); border:1px solid color-mix(in srgb, var(--gold) 28%, transparent); padding:4px 9px; border-radius:20px;
  }
  .topbar-alert{
    display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color: var(--amber);
    background: color-mix(in srgb, var(--amber) 10%, transparent); border:1px solid color-mix(in srgb, var(--amber) 28%, transparent); padding:6px 12px; border-radius:20px;
  }
  .topbar-right{ display:flex; align-items:center; gap:12px; }
  .topbar-search{ width:200px; }
  .mobile-search-btn{ display:none; width:40px; height:40px; border-radius:9px; border:1px solid var(--border); background:var(--surface-2); color:var(--text-dim); cursor:pointer; align-items:center; justify-content:center; flex-shrink:0; }
  .mobile-search-btn svg{ width:16px; height:16px; }
  .mobile-search-bar{ display:none; padding:0 26px 12px 26px; }
  .mobile-search-bar.open{ display:block; }
  .topbar-search .search-input{ width:100%; }
  .notif-wrap{ position:relative; }
  .notif-btn{
    position:relative; width:40px; height:40px; border-radius:9px; border:1px solid var(--border);
    background: var(--surface-2); color:var(--text-dim); cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .notif-btn:hover{ color:var(--text); }
  .notif-btn svg{ width:17px; height:17px; }
  .notif-count{
    position:absolute; top:-5px; right:-5px; min-width:16px; height:16px; padding:0 3px; border-radius:8px;
    background: var(--red); color:#fff; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .notif-panel{
    display:none; position:absolute; top:44px; right:0; width:320px; max-height:420px; overflow-y:auto;
    background: var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.35); z-index:55;
  }
  .notif-panel.open{ display:block; }
  .notif-item{
    display:flex; align-items:flex-start; gap:10px; padding:10px; border-radius:8px; cursor:pointer;
  }
  .notif-item:hover{ background: var(--surface-2); }
  .notif-item .ni-icon{ width:28px; height:28px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .notif-item .ni-icon svg{ width:14px; height:14px; }
  .notif-item .ni-title{ font-size:12.5px; font-weight:600; }
  .notif-item .ni-sub{ font-size:11px; color:var(--text-faint); margin-top:1px; }
  .notif-empty{ text-align:center; padding:26px 10px; color:var(--text-faint); font-size:12.5px; }
  #view{ flex:1; overflow-y:auto; padding: 22px 26px 44px 26px; animation: fadeIn .2s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);} }

  .grid{ display:grid; gap:16px; }
  .grid-4{ grid-template-columns: repeat(4, 1fr); }
  .grid-3{ grid-template-columns: repeat(3, 1fr); }
  .grid-2{ grid-template-columns: repeat(2, 1fr); }
  .card{
    background: var(--surface); border:1px solid var(--border-soft); border-radius:12px; padding:18px;
    transition: border-color .15s;
  }
  .stat-card{ position:relative; border-left:3px solid var(--sc, var(--blue)); display:flex; align-items:flex-start; gap:12px; }
  .stat-card .stat-icon{
    width:34px; height:34px; border-radius:9px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background: color-mix(in srgb, var(--sc, var(--blue)) 15%, transparent); color: var(--sc, var(--blue));
  }
  .stat-card .stat-icon svg{ width:17px; height:17px; }
  .stat-card .stat-label{ font-size:11px; color:var(--text-dim); font-weight:600; }
  .stat-card .stat-value{ font-family:'JetBrains Mono',monospace; font-size:24px; font-weight:700; margin-top:6px; color: var(--sc, var(--text)); }
  .stat-card .stat-sub{ font-size:11.5px; color:var(--text-dim); margin-top:5px; }
  .stat-card.featured{ grid-column: span 2; }
  .stat-card.featured .stat-icon{ width:40px; height:40px; }
  .stat-card.featured .stat-icon svg{ width:20px; height:20px; }
  .stat-card.featured .stat-value{ font-size:32px; }
  .stat-card.attention{ border-left-color: var(--red); }
  .stat-card.attention .stat-icon{ background: color-mix(in srgb, var(--red) 15%, transparent); color: var(--red); }

  .section-title{
    font-family:'Manrope',sans-serif; font-size:14px; font-weight:700; color:var(--text);
    margin: 26px 0 12px 0; display:flex; align-items:center; gap:9px;
  }
  .section-title:first-child{ margin-top:0; }
  .section-title::before{ content:''; width:4px; height:14px; border-radius:2px; background: var(--sc2, var(--blue)); }

  .btn{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600; padding:9px 15px; border-radius:8px;
    border:1px solid var(--border); background: var(--surface-2); color: var(--text); cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; transition: filter .12s;
  }
  .btn:hover{ filter:brightness(1.14); }
  .btn-primary{ background: linear-gradient(90deg, var(--blue), var(--teal)); color:#fff; border-color:transparent; }
  .btn-ghost{ background:transparent; }
  .btn-sm{ padding:6px 11px; font-size:11.5px; }

  .gauge-wrap{ display:flex; align-items:flex-end; gap:11px; }
  .gauge{
    width: 27px; height: 86px; border-radius:6px 6px 3px 3px; background: var(--bg-0);
    border: 1px solid var(--border); position:relative; overflow:hidden; flex-shrink:0;
  }
  .gauge::before{ content:''; position:absolute; top:0; left:0; right:0; height:5px; background: var(--border); z-index:2; }
  .gauge-fill{ position:absolute; bottom:0; left:0; right:0; transition: height .5s ease; }
  .gauge-fill.ok{ background: var(--green); }
  .gauge-fill.mid{ background: var(--amber); }
  .gauge-fill.low{ background: var(--red); }
  .gauge-meta .g-name{ font-size:13px; font-weight:700; }
  .gauge-meta .g-loc{ font-size:11px; color:var(--text-faint); margin-top:1px; }
  .gauge-meta .g-pct{ font-family:'JetBrains Mono',monospace; font-size:19px; margin-top:6px; font-weight:700; }
  .gauge-meta .g-vol{ font-size:11px; color:var(--text-dim); margin-top:1px; }

  .prod-dot{ display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .prod-Diesel{ background: var(--amber); }
  .prod-Petrol{ background: var(--green); }
  .prod-Paraffin{ background: var(--violet); }
  .prod-Gas{ background: var(--gold); }
  .unit-toggle{ display:flex; gap:8px; }
  .unit-toggle-btn{
    flex:1; background: var(--surface-2); border:1px solid var(--border); color:var(--text-dim);
    padding:9px; border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .unit-toggle-btn.active{ background: color-mix(in srgb, var(--indigo) 16%, var(--surface-2)); border-color: var(--indigo); color: var(--text); }
  .transport-hired-tag{ display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--amber); background: color-mix(in srgb, var(--amber) 14%, transparent); padding:1.5px 6px; border-radius:5px; margin-right:5px; }
  .truck-class-badge{ display:inline-block; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; color:var(--teal); background: color-mix(in srgb, var(--teal) 14%, transparent); padding:2px 8px; border-radius:6px; }
  .short-lift-badge{ display:inline-block; font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--red); background: color-mix(in srgb, var(--red) 14%, transparent); padding:1.5px 6px; border-radius:5px; }
  .ownership-badge{ display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:6px; }
  .ownership-badge.COCO{ color:var(--green); background: color-mix(in srgb, var(--green) 14%, transparent); }
  .ownership-badge.CODO{ color:var(--blue); background: color-mix(in srgb, var(--blue) 14%, transparent); }
  .ownership-badge.DODO{ color:var(--amber); background: color-mix(in srgb, var(--amber) 14%, transparent); }
  .channel-badge{ display:inline-block; font-size:10px; font-weight:600; padding:2px 7px; border-radius:6px; color:var(--text-dim); background:var(--surface-2); border:1px solid var(--border-soft); }
  .network-visibility-card{ background: color-mix(in srgb, var(--amber) 8%, var(--surface)); border:1px solid color-mix(in srgb, var(--amber) 25%, var(--border-soft)); border-radius:9px; padding:12px 14px; margin-bottom:18px; }
  .delivery-context-card{ background: var(--bg-0); border:1px solid var(--border); border-radius:9px; padding:12px 14px; margin-bottom:14px; }
  .dc-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:5px 0; font-size:12px; }
  .dc-row:not(:last-child){ border-bottom:1px solid var(--border-soft); }
  .dc-label{ color:var(--text-faint); font-weight:600; flex-shrink:0; }
  .dc-val{ color:var(--text); font-weight:600; text-align:right; }
  .clickable-row{ cursor:pointer; }
  .detail-box{ background: var(--bg-0); border:1px solid var(--border); border-radius:9px; padding:12px 14px; margin-bottom:18px; }

  .depot-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
  .depot-head .d-name{ font-family:'Manrope',sans-serif; font-size:15px; font-weight:700; }
  .depot-head .d-loc{ font-size:11.5px; color:var(--text-faint); margin-top:2px; }
  .tanks-row{ display:flex; gap:24px; flex-wrap:wrap; }
  .forecast-strip, .cyl-stock-strip{ display:flex; gap:16px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--border-soft); }
  .forecast-item, .cyl-stock-item{ background:var(--bg-0); border:1px solid var(--border-soft); border-radius:8px; padding:10px 12px; min-width:180px; flex:1; }
  .fi-head{ font-size:12.5px; font-weight:700; margin-bottom:4px; display:flex; align-items:center; }
  .quality-hold-tag{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:11px; font-weight:700; color:var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); border-radius:6px; padding:4px 8px; margin:4px 0; }
  .cyl-stock-row{ display:flex; justify-content:space-between; font-size:11.5px; margin-top:2px; }

  table{ width:100%; border-collapse:collapse; }
  thead th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em;
    color: var(--text-faint); font-weight:700; padding: 10px 12px; border-bottom:1px solid var(--border-soft);
  }
  tbody td{ padding:12px; border-bottom:1px solid var(--border-soft); font-size:13px; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background: var(--surface-2); }
  .id-cell{ font-family:'JetBrains Mono',monospace; color:var(--text-dim); font-size:12px; }

  .badge{
    display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700;
    padding:4px 10px; border-radius:20px; white-space:nowrap; border:1px solid transparent;
  }
  .badge-dot{ width:6px; height:6px; border-radius:50%; }
  .badge.pending{ background: color-mix(in srgb, var(--text-dim) 14%, transparent); color: var(--text-dim); }
  .badge.pending .badge-dot{ background: var(--text-dim); }
  .badge.dispatched{ background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); }
  .badge.dispatched .badge-dot{ background: var(--amber); }
  .badge.transit{ background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }
  .badge.transit .badge-dot{ background: var(--blue); animation: pulse 1.6s infinite; }
  .badge.delivered{ background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
  .badge.delivered .badge-dot{ background: var(--green); }
  .badge.paid{ background: color-mix(in srgb, var(--green) 14%, transparent); color: var(--green); }
  .badge.paid .badge-dot{ background: var(--green); }
  .badge.overdue{ background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
  .badge.overdue .badge-dot{ background: var(--red); animation: pulse 1.6s infinite; }
  .badge.mine{ background: color-mix(in srgb, var(--orange) 14%, transparent); color: var(--orange); }
  .badge.mine .badge-dot{ background: var(--orange); }
  .badge.station{ background: color-mix(in srgb, var(--teal) 14%, transparent); color: var(--teal); }
  .badge.station .badge-dot{ background: var(--teal); }
  .badge.idle{ background: color-mix(in srgb, var(--text-dim) 14%, transparent); color: var(--text-dim); }
  .badge.idle .badge-dot{ background: var(--text-dim); }
  .badge.enroute{ background: color-mix(in srgb, var(--indigo) 16%, transparent); color: var(--indigo); }
  .badge.enroute .badge-dot{ background: var(--indigo); animation: pulse 1.6s infinite; }
  .badge.service{ background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
  .badge.cancelled{ background: color-mix(in srgb, var(--text-faint) 16%, transparent); color: var(--text-faint); text-decoration: line-through; }
  .badge.cancelled .badge-dot{ background: var(--text-faint); }
  .badge.service .badge-dot{ background: var(--red); }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }

  .client-chip{ display:flex; align-items:center; gap:10px; }
  .avatar{
    width:30px; height:30px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Manrope',sans-serif; font-weight:700; font-size:12px; color:#fff;
  }
  .avatar.mine{ background: linear-gradient(135deg, var(--orange), var(--red)); }
  .avatar.station{ background: linear-gradient(135deg, var(--teal), var(--blue)); }

  .dept-card{ cursor:pointer; border-left:3px solid var(--dc, var(--blue)); }
  .dept-card:hover{ border-color: var(--dc, var(--blue)); background: var(--surface-2); }
  .dept-icon{
    width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    background: color-mix(in srgb, var(--dc, var(--blue)) 16%, transparent); color: var(--dc, var(--blue)); margin-bottom:12px;
  }
  .dept-icon svg{ width:18px; height:18px; }
  .dept-name{ font-family:'Manrope',sans-serif; font-size:14.5px; font-weight:700; }
  .dept-owner{ font-size:11.5px; color:var(--text-faint); margin-top:3px; }

<div id="app">

<script>
const ICONS = {

  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',

  support: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.8.4-1 1-1 1.7"/><path d="M12 17h.01"/></svg>',

  procurement: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>',
  executive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 20V10M9 20V4M15 20v-7M21 20v-3"/></svg>',
  orgchart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="4" rx="1"/><rect x="3" y="17" width="6" height="4" rx="1"/><rect x="15" y="17" width="6" height="4" rx="1"/><path d="M12 7v4M12 11H6v6M12 11h6v6"/></svg>',
};

/* ============================= I18N ============================= */
const LANG_NAMES = { en:'English', hinglish:'Hinglish', ar:'Arabic', fr:'French', es:'Spanish', pt:'Portuguese' };
const LOCALE_MAP = { en:'en-US', hinglish:'en-IN', ar:'ar-AE', fr:'fr-FR', es:'es-ES', pt:'pt-PT' };
// Explicit instruction for the AI assistant — "Hinglish" alone is ambiguous (could read as
// Devanagari Hindi mixed with English); this pins down exactly what's wanted: Roman script,
// Hindi meaning, natural code-mixing with English business terms.
function aiLanguageInstruction(){
  if(currentLang==='hinglish'){
    return 'Respond in Hinglish — Hindi meaning and grammar, written entirely in Roman/English script (like how Indians text and chat day to day), never in Devanagari script. Keep common business and technical terms in English where that is how they would naturally be said (e.g. "Order dispatch ho gaya", "Stock kam hai"), not forced literal Hindi.';
  }
  return `Respond in ${LANG_NAMES[currentLang] || 'English'}.`;
}
let currentLang = 'en';
let currentTheme = 'light';
let themeManuallySet = false;
function getTimeBasedTheme(){
  const hour = new Date().getHours();
  return (hour >= 19 || hour < 7) ? 'dark' : 'light'; // dark 7pm–7am, light otherwise
}
let currentRole = 'admin';
let currentDriverName = null;
let currentCustomerId = null;
const ROLES = {
  admin:      { labelKey:'deptGlobalOps', allow:'all' },
  global_ceo: { labelKey:'orgGlobalCeo',  allow:'all' },
  cluster_ceo:{ labelKey:'roleClusterCeo', allow:['dashboard','departments','orgchart','deliveries','inventory','procurement','fleet','reconciliation','clients','finance','compliance','support','executive','reports'] },
  country_head:{ labelKey:'roleCountryHead', allow:['dashboard','departments','orgchart','deliveries','inventory','procurement','fleet','reconciliation','clients','finance','compliance','support','executive','reports'] },
  country_finance:{ labelKey:'roleCountryFinance', allow:['dashboard','departments','orgchart','finance','clients','reconciliation','reports'] },
  dispatch:   { labelKey:'deptDispatch',   allow:['dashboard','departments','deliveries','fleet','reports'] },
  procurement:{ labelKey:'roleProcurement', allow:['dashboard','departments','inventory','procurement','reports'] },
  finance:    { labelKey:'navFinance',     allow:['dashboard','departments','finance','clients','reports'] },
  compliance: { labelKey:'navCompliance',  allow:['dashboard','departments','compliance','reconciliation','inventory','reports'] },
  support:    { labelKey:'navSupport',     allow:['dashboard','departments','support','clients','reports'] },
  driver:     { labelKey:'roleDriver',     allow:['dashboard','deliveries'] },
  customer:   { labelKey:'roleCustomer',   allow:['dashboard','myaccount'] },
  executive:  { labelKey:'roleExecutive',  allow:['dashboard','departments','executive','reports'] },
};
function roleAllows(viewId){
  const r = ROLES[currentRole];
  return r.allow === 'all' || r.allow.includes(viewId);
}
/* ---- Country/cluster data scoping — genuinely restricts what these roles see,
   not just a label. Any role with a country picked at login is now scoped to it,
   not just Country Head/Finance — that's a deliberate extension driven by the
   login flow (pick your country first, everything after inherits that scope). ---- */
let currentCountryContext = null;
let currentClusterContext = null;
function scopedCountries(){
  if(currentRole==='admin' || currentRole==='global_ceo') return null;
  if(currentRole==='cluster_ceo' && currentClusterContext) return CLUSTERS[currentClusterContext].countries;
  if(currentCountryContext) return [currentCountryContext];
  return null; // null = unrestricted
}
function isCountryVisible(country){
  const sc = scopedCountries();
  return !sc || sc.includes(country);
}
function visibleDepots(){ return depots.filter(d=> isCountryVisible(countryOf(d.location))); }
function visibleClients(){ return clients.filter(c=> isCountryVisible(countryOf(c.location))); }
function visibleFleetList(){ const ids=new Set(visibleDepots().map(d=>d.id)); return fleet.filter(v=>ids.has(v.depot)); }
function visibleDeliveriesList(){ const ids=new Set(visibleDepots().map(d=>d.id)); return deliveries.filter(d=>ids.has(d.depot)); }
function visibleInvoicesList(){ const ids=new Set(visibleClients().map(c=>c.id)); return invoices.filter(i=>ids.has(i.client)); }
function visiblePurchaseOrdersList(){ const ids=new Set(visibleDepots().map(d=>d.id)); return purchaseOrders.filter(p=>ids.has(p.depot)); }
function visibleSuppliersList(){ return suppliers.filter(s=> isCountryVisible(s.country)); }
function visibleQualityRecordsList(){ const ids=new Set(visibleDepots().map(d=>d.id)); return qualityRecords.filter(q=>ids.has(q.depot)); }
function visibleLicensesList(){ const ids=new Set(visibleDepots().map(d=>d.id)); return licenses.filter(l=>ids.has(l.depot)); }
function visibleIncidentsList(){ const ids=new Set(visibleDepots().map(d=>d.id)); return incidents.filter(i=>ids.has(i.depot)); }
function visibleTicketsList(){ const ids=new Set(visibleClients().map(c=>c.id)); return tickets.filter(tk=>ids.has(tk.client)); }
function visibleExternalSupplyLog(){ const ids=new Set(visibleClients().map(c=>c.id)); return externalSupplyLog.filter(e=>ids.has(e.client)); }
function canManageDeliveries(){ return currentRole==='admin' || currentRole==='dispatch' || currentRole==='country_head'; }
function canProgressDeliveries(){ return currentRole==='admin' || currentRole==='dispatch' || currentRole==='driver' || currentRole==='country_head'; }
function canManageFinance(){ return currentRole==='admin' || currentRole==='finance' || currentRole==='country_finance'; }
function canManageSupport(){ return currentRole==='admin' || currentRole==='support'; }
function denyPermission(){ showToast(t('toastNoPermission'), 'info'); }
function setRole(role){
  currentRole = role;
  currentCountryContext = null;
  currentClusterContext = null;
  sessionActive = true; // programmatic role changes (tests, quick internal calls) stay usable without forcing the wizard
  if(!roleAllows(currentView)) currentView = 'dashboard';
  renderAll();
}

/* ============================= LOGIN WIZARD ============================= */
// Country -> Designation -> Passcode. Illustrative auth only (any 4+ character
// passcode is accepted) — this simulates the login sequence, it is not real security.
let sessionActive = false;
let loginStep = 1;
let loginCountry = null;
let loginDesignation = null;
let loginError = null;

const GLOBAL_DESIGNATIONS = [
  { role:'admin',       labelKey:'roleDemoAdmin' },
  { role:'global_ceo',  labelKey:'orgGlobalCeo' },
  { role:'cluster_ceo', cluster:'asia',  labelKey:'orgAsiaCeo' },
  { role:'cluster_ceo', cluster:'dubai', labelKey:'orgDubaiCeo' },
  { role:'executive',   labelKey:'roleExecutive' },
];
const COUNTRY_DESIGNATIONS = [
  { role:'country_head',    labelKey:'orgCountryHead' },
  { role:'country_finance', labelKey:'orgFinanceHead' },
  { role:'dispatch',        labelKey:'deptDispatch' },
  { role:'procurement',     labelKey:'roleProcurement' },
  { role:'finance',         labelKey:'navFinance' },
  { role:'compliance',      labelKey:'navCompliance' },
  { role:'support',         labelKey:'navSupport' },
  { role:'driver',          labelKey:'roleDriver' },
  { role:'customer',        labelKey:'roleCustomer' },
];

function openLoginWizard(){
  sessionActive = false;
  loginStep = 1; loginCountry = null; loginDesignation = null; loginError = null;
  renderLoginWizard();
  document.getElementById('loginWizard').classList.add('open');
}
function selectLoginCountry(country){
  loginCountry = country;
  loginStep = 2;
  renderLoginWizard();
}
function selectLoginDesignation(idx){
  const pool = loginCountry==='__global__' ? GLOBAL_DESIGNATIONS : COUNTRY_DESIGNATIONS;
  loginDesignation = pool[idx];
  loginStep = 3;
  loginError = null;
  renderLoginWizard();
}
function backLoginStep(){
  loginStep = Math.max(1, loginStep-1);
  loginError = null;
  renderLoginWizard();
}
function submitPasscode(){
  const val = (document.getElementById('loginPasscode')?.value || '').trim();
  if(val.length < 4){
    loginError = t('loginPasscodeError');
    renderLoginWizard();
    return;
  }
  currentRole = loginDesignation.role;
  currentCountryContext = (loginCountry && loginCountry!=='__global__') ? loginCountry : null;
  currentClusterContext = loginDesignation.cluster || null;
  sessionActive = true;
  currentView = 'dashboard';
  document.getElementById('loginWizard').classList.remove('open');
  renderStaticText();
  renderAll();
}
function switchAccount(){
  openLoginWizard();
}
function renderLoginWizard(){
  const el = document.getElementById('loginWizard');
  if(!el) return;
  let inner = '';
  if(loginStep===1){
    const countries = Object.keys(TAX_RULES);
    inner = `
      <div class="login-step-title">${t('loginCountryStepTitle')}</div>
      <div class="login-grid">
        ${countries.map(c=>`<button class="login-choice" onclick="selectLoginCountry('${c}')">${c}</button>`).join('')}
        <button class="login-choice login-choice-global" onclick="selectLoginCountry('__global__')">${t('globalCorporateHQ')}</button>
      </div>
    `;
  } else if(loginStep===2){
    const pool = loginCountry==='__global__' ? GLOBAL_DESIGNATIONS : COUNTRY_DESIGNATIONS;
    inner = `
      <div class="login-step-title">${t('loginDesignationStepTitle')}</div>
      <div class="login-sub">${loginCountry==='__global__' ? t('globalCorporateHQ') : loginCountry}</div>
      <div class="login-grid login-grid-list">
        ${pool.map((d,i)=>`<button class="login-choice" onclick="selectLoginDesignation(${i})">${t(d.labelKey)}</button>`).join('')}
      </div>
      <button class="btn btn-ghost" style="margin-top:14px;" onclick="backLoginStep()">${t('btnBack')}</button>
    `;
  } else {
    inner = `
      <div class="login-step-title">${t('loginPasscodeStepTitle')}</div>
      <div class="login-sub">${loginCountry==='__global__' ? t('globalCorporateHQ') : loginCountry} · ${t(loginDesignation.labelKey)}</div>
      <input type="password" id="loginPasscode" class="login-passcode-input" placeholder="••••" maxlength="8" onkeydown="if(event.key==='Enter') submitPasscode();">
      <div class="login-hint">${t('loginPasscodeHint')}</div>
      ${loginError ? `<div class="login-error">${loginError}</div>` : ''}
      <div style="display:flex; gap:10px; margin-top:16px;">
        <button class="btn btn-ghost" onclick="backLoginStep()">${t('btnBack')}</button>
        <button class="btn btn-primary" onclick="submitPasscode()">${t('btnSignIn')}</button>
      </div>
    `;
  }
  el.innerHTML = `<div class="login-card">${inner}</div>`;
}

function t(key, vars){
  let s = (TRANSLATIONS[currentLang] && TRANSLATIONS[currentLang][key]) || TRANSLATIONS.en[key] || key;
  if(vars) Object.keys(vars).forEach(k=> { s = s.replace('{'+k+'}', vars[k]); });
  return s;
}

function showToast(message, tone){
  tone = tone || 'success';
  const color = tone==='success' ? 'var(--green)' : 'var(--blue)';
  const container = document.getElementById('toastContainer');
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.setProperty('--tc', color);
  el.innerHTML = `<span class="toast-icon">${TOAST_ICONS[tone] || TOAST_ICONS.success}</span><span>${escapeHtml(message)}</span>`;
  container.appendChild(el);
  setTimeout(()=>{
    el.classList.add('leaving');
    setTimeout(()=> el.remove(), 200);
  }, 2800);
}

// Real, computed performance per leader — scoped to their country/cluster from actual
// data, not placeholder numbers. Returns null fields where there's genuinely nothing
// to measure yet, rather than fabricating a metric.
function countriesForScope(scopeKey){
  if(scopeKey==='global') return Object.keys(ORG_CHART.countryLeads);
  if(CLUSTERS[scopeKey]) return CLUSTERS[scopeKey].countries;
  return [scopeKey];
}
function computeLeaderPerformance(scopeKey){
  const countries = countriesForScope(scopeKey);
  const inScope = c => countries.includes(countryOf(c.location));
  const depotsIn = depots.filter(d=>inScope(d));
  const depotIds = new Set(depotsIn.map(d=>d.id));
  const clientsIn = clients.filter(c=>inScope(c));
  const clientIds = new Set(clientsIn.map(c=>c.id));
  const delivIn = deliveries.filter(d=>depotIds.has(d.depot));
  const invIn = invoices.filter(i=>clientIds.has(i.client));

  const revenue = invIn.reduce((s,i)=>s+i.amount,0);
  const outstanding = invIn.filter(i=>invoiceStatusDisplay(i)!=='paid').reduce((s,i)=>s+i.amount,0);
  const cleanDeliv = delivIn.filter(d=>d.status==='delivered' && d.deliveredQty!=null);
  const slaClean = cleanDeliv.filter(d=> ((d.qty-d.deliveredQty)/d.qty)*100 <= 1.5).length;
  const slaPct = cleanDeliv.length ? Math.round((slaClean/cleanDeliv.length)*100) : null;
  const activeOrders = delivIn.filter(d=>d.status!=='delivered' && d.status!=='cancelled').length;

  return {
    revenue, outstanding, accounts: clientsIn.length, depots: depotsIn.length,
    slaPct, activeOrders, deliveredCount: cleanDeliv.length,
  };
}
function countryOf(locationStr){
  return (locationStr || '').split(',').pop().trim();
}

let auditChainTip = '00000000';
// Illustrative tamper-evident hash chain — a real deployment would use a cryptographic
// hash (e.g. SHA-256 via a server-side ledger or blockchain-anchored log), not this
// simplified 32-bit hash. This demonstrates the *mechanism*, not production-grade security.
function simpleHash(str){
  let h = 0x811c9dc5;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16).padStart(8,'0');
}
function logActivity(kind, message){
  const entry = { id:'LOG-'+(activityLog.length+1), time: nowTime(), kind, message, prevHash: auditChainTip };
  entry.hash = simpleHash(entry.id+'|'+entry.time+'|'+entry.kind+'|'+entry.message+'|'+entry.prevHash);
  auditChainTip = entry.hash;
  activityLog.unshift(entry);
  if(activityLog.length > 200) activityLog.pop();
}
function verifyAuditChain(){
  const chronological = [...activityLog].reverse();
  let prev = '00000000';
  for(const e of chronological){
    if(e.prevHash !== prev) return { ok:false, brokenAt:e.id };
    const recomputed = simpleHash(e.id+'|'+e.time+'|'+e.kind+'|'+e.message+'|'+e.prevHash);
    if(recomputed !== e.hash) return { ok:false, brokenAt:e.id };
    prev = e.hash;
  }
  return { ok:true, brokenAt:null };
}
function simulateTamper(){
  if(activityLog.length===0) return;
  const idx = Math.floor(Math.random()*activityLog.length);
  activityLog[idx].message = activityLog[idx].message + ' [ALTERED]';
  if(currentView==='audit') document.getElementById('view').innerHTML = viewAuditLog();
  showToast(t('toastTamperSimulated'), 'info');
}

/* ---- Bulk channel & retail network — how a fuel major actually splits these two
   businesses. A delivery's channel is set at creation from the client record:
   'direct' / 'agent' for B2B (mine) clients per their own channel field, and
   'internal_retail' for any delivery to one of our retail stations (COCO/CODO/DODO) —
   that's an inter-division transfer, not a "sale" in the normal sense. ---- */
function deliveryChannelFor(client){
  if(!client) return 'direct';
  if(client.type==='mine') return client.channel || 'direct';
  return 'internal_retail';
}
function channelLabel(channel){
  return { direct:t('channelDirect'), agent:t('channelAgent'), internal_retail:t('channelInternalRetail') }[channel] || channel;
}
// DODO sites are genuinely independent — the owner can buy from us or a competitor.
// estimatedMarketShare (survey/mystery-shopping based, like real downstream ops teams
// actually track this — there's no exact competitor delivery data to draw on) tells us
// what fraction of that station's real throughput we're actually supplying.
function estimatedNetworkVolume(client){
  const ours = client.delivered || 0;
  if(client.ownership!=='DODO' || client.estimatedMarketShare==null || client.estimatedMarketShare<=0){
    return { ours, totalEstimate: ours, externalEstimate: 0, sharePct: 100 };
  }
  const share = client.estimatedMarketShare;
  const totalEstimate = Math.round(ours / (share/100));
  return { ours, totalEstimate, externalEstimate: Math.max(0, totalEstimate-ours), sharePct: share };
}
// Actual logged external-sourcing entries for a station — kept separate from the
// market-share estimate above rather than blended into one number. They come from
// different sources of truth (a statistical proxy vs. self-reported/observed purchases)
// and rarely reconcile exactly; showing both with their provenance is more honest than
// quietly picking one.
function loggedExternalSupply(clientId){
  return externalSupplyLog.filter(e=>e.client===clientId);
}
function canLogExternalSupply(client){
  return client && client.type==='station' && (client.ownership==='CODO' || client.ownership==='DODO');

function totalStock(product){
  let total=0;
  visibleDepots().forEach(d=> d.tanks.forEach(tk=>{ if(!product || tk.product===product) total += tk.level; }));
  return total;
}
function lowStockTanks(){
  let out=[];
  visibleDepots().forEach(d=> d.tanks.forEach(tk=>{ if(tk.level <= tk.reorder) out.push({depot:d,tank:tk}); }));
  return out;
}

/* ---- Demand forecasting (trend-based, not ML) ---- */
// Honest method: average daily volume dispatched for this depot+product over the
// lookback window, projected forward against current tank level. This is a simple
// moving-average projection, not a predictive model — flagged as such in the UI.
function forecastForTank(depotId, product, lookbackDays){
  lookbackDays = lookbackDays || 14;
  const cutoff = addDays(TODAY, -lookbackDays);
  const relevant = deliveries.filter(d=> d.depot===depotId && d.product===product && d.dispatchedAt && d.date>=cutoff && d.date<=TODAY);
  const totalDispatched = relevant.reduce((s,d)=> s + d.qty, 0);
  const avgDaily = totalDispatched / lookbackDays;
  const tank = depotById(depotId)?.tanks.find(tk=>tk.product===product);
  if(!tank) return null;
  const daysToStockout = avgDaily > 0 ? Math.round(tank.level / avgDaily) : null;
  const suggestedQty = Math.max(0, Math.round((tank.capacity*0.85) - tank.level));
  return { avgDaily: Math.round(avgDaily), daysToStockout, suggestedQty, tank };
}

/* ---- Credit risk ---- */
function creditUtilizationPct(clientId){
  const c = clientById(clientId);
  if(!c || !c.creditLimit) return 0;
  return (outstandingBalance(clientId) / c.creditLimit) * 100;
}
function creditRiskLevel(clientId){
  const c = clientById(clientId);
  if(!c || !c.creditLimit) return 'none'; // COD clients carry no credit risk
  const pct = creditUtilizationPct(clientId);
  if(pct >= 100) return 'high';
  if(pct >= 70) return 'medium';
  return 'low';
}
function checkCreditBlock(clientId, estimatedQty, product){
  const c = clientById(clientId);
  if(!c || !c.creditLimit) return { blocked:false };
  const estAmount = estimatedQty * (PRICES[product]||1.3);
  const projected = outstandingBalance(clientId) + estAmount;
  if(projected > c.creditLimit){
    return { blocked:true, projected, limit:c.creditLimit };
  }
  return { blocked:false };
}

function confirmReceivePO(id){
  if(!canManageProcurement()){ denyPermission(); return; }
  const po = purchaseOrders.find(p=>p.id===id);
  if(!po || po.status!=='in_transit') return;
  const isCyl = po.product==='Gas Cylinders';
  let uplifted = parseInt(document.getElementById('f-uplift-qty').value||'0',10);
  if(!uplifted || uplifted<=0){ alert(t('validVolume')); return; }
  uplifted = Math.min(uplifted, po.qty); // can't uplift more than what was booked in this model
  po.status = 'received';
  po.receivedDate = TODAY;
  po.upliftedQty = uplifted;
  po.pendingQty = Math.max(0, po.qty - uplifted);
  const dep = depotById(po.depot);
  const shortLifted = po.pendingQty > 0;

  if(isCyl){
    const cyl = dep?.cylinders?.find(c=>c.size===po.cylinderSize);
    if(cyl){
      cyl.fullStock = Math.min(cyl.capacity, cyl.fullStock + uplifted);
      cyl.emptyStock = Math.max(0, cyl.emptyStock - uplifted);
    }
    closeModal();
    renderAll();
    showToast(t('toastRefillReceived',{id, qty:fmt(uplifted), size:po.cylinderSize}), 'success');
    logActivity('order', t('logPoReceived',{id}));
    if(shortLifted) showToast(t('toastShortLift',{id, n:fmt(po.pendingQty)}), 'info');
    return;
  }

  const tank = dep?.tanks.find(tk=>tk.product===po.product);
  if(tank) tank.level = Math.min(tank.capacity, tank.level + uplifted);
  // Simulated lab result on receipt — illustrative ranges, not a real lab integration
  const result = generateQualityRecord(po, uplifted);
  closeModal();
  renderAll();
  showToast(t('toastPoReceived',{id, qty:fmt(uplifted)}), 'success');
  logActivity('order', t('logPoReceived',{id}));
  if(result.result==='fail'){
    showToast(t('toastQualityHold',{product:po.product, depot:dep?.name||''}), 'info');
  }
  if(shortLifted){
    showToast(t('toastShortLift',{id, n:fmt(po.pendingQty)}), 'info');
    logActivity('order', t('logShortLift',{id, n:fmt(po.pendingQty)}));
  }
}
function createFollowUpPO(id){
  if(!canManageProcurement()){ denyPermission(); return; }
  const po = purchaseOrders.find(p=>p.id===id);
  if(!po || !po.pendingQty || po.pendingQty<=0) return;
  const newId = createPurchaseOrder(po.supplier, po.depot, po.product, po.pendingQty, po.unitCost, false);
  const newPo = purchaseOrders.find(p=>p.id===newId);
  newPo.transportMode = po.transportMode || 'truck_owned';
  newPo.followUpTo = po.id;
  po.pendingQty = 0; // this shortfall is now being tracked by the follow-up PO instead
  renderAll();
  showToast(t('toastFollowUpCreated',{id:newId, from:po.id}), 'success');
  logActivity('order', t('logFollowUpCreated',{id:newId, from:po.id}));
}
function generateQualityRecord(po, receivedQty){
  seq.qc++;
  const qcId = 'QC-'+String(seq.qc).padStart(3,'0');
  const ranges = {
    Diesel:   { cetane:[48,58], density:[820,845], water:[0.0,0.06], sulphur:[5,15] },
    Petrol:   { cetane:[0,0],   density:[715,770], water:[0.0,0.05], sulphur:[3,10] },
    Paraffin: { cetane:[0,0],   density:[780,800], water:[0.0,0.08], sulphur:[2,8] },
    Gas:      { cetane:[0,0],   density:[500,580], water:[0.0,0.03], sulphur:[1,5] },
  };
  const r = ranges[po.product] || ranges.Diesel;
  const rand = (lo,hi)=> +(lo + Math.random()*(hi-lo)).toFixed(2);
  const water = rand(r.water[0], r.water[1] * 1.3); // occasionally exceeds spec
  const fail = water > r.water[1];
  const rec = {
    id:qcId, lot: po.depot? ('LOT-'+po.depot+'-'+po.receivedDate.replace(/-/g,'')+'-'+po.product.slice(0,3).toUpperCase()) : qcId,
    po: po.id, product: po.product, depot: po.depot, date: po.receivedDate, qty: receivedQty!=null ? receivedQty : po.qty,
    cetane: po.product==='Diesel'? Math.round(rand(r.cetane[0],r.cetane[1])) : null,
    density: Math.round(rand(r.density[0], r.density[1])),
    waterPct: water, sulphurPpm: Math.round(rand(r.sulphur[0], r.sulphur[1])),
    result: fail? 'fail' : 'pass',
  };
  qualityRecords.push(rec);
  if(fail){
    const dep = depotById(po.depot);
    const tank = dep?.tanks.find(tk=>tk.product===po.product);
    if(tank) tank.qualityHold = true;
    logActivity('order', t('logQualityFail',{lot:rec.lot}));
  }
  return rec;
}
function clearQualityHold(depotId, product){

}

function generateInvoiceForDelivery(d){
  const c = clientById(d.client);
  if(!c) return;
  const billedQty = d.deliveredQty != null ? d.deliveredQty : d.qty;
  const isCylinder = d.unit==='cylinders';
  const price = isCylinder ? (CYLINDER_PRICES[d.cylinderSize] || 20) : (PRICES[d.product] || 1.3);
  const base = billedQty * price;
  const country = countryOf(c.location);
  const rules = TAX_RULES[country] || { vatPct:0, dutyPerLitre:0 };
  const duty = isCylinder ? 0 : billedQty * rules.dutyPerLitre; // cylinder pricing is already all-in per unit
  const vat = (base + duty) * (rules.vatPct/100);
  const amount = Math.round(base + duty + vat);
  const isCOD = c.terms === 'Cash on Delivery';
  const dueDays = c.terms.startsWith('Net') ? parseInt(c.terms.split(' ')[1],10) : 0;
  const dueDate = addDays(d.date, dueDays);
  invoices.push({
    id:'INV-'+(seq.inv++), delivery:d.id, client:d.client, amount, qty:billedQty,
    base:Math.round(base), duty:Math.round(duty), vat:Math.round(vat), country,
    date:d.date, dueDate, status: isCOD ? 'paid' : 'pending'
  });
}
function invoiceStatusDisplay(inv){
  if(inv.status==='paid') return 'paid';
  return inv.dueDate < TODAY ? 'overdue' : 'pending';
}

/* ============================= PERSISTENCE ============================= */
// This file runs as a standalone downloaded HTML page (not Claude's sandboxed
// Artifact preview), so per-origin localStorage is available and safe here.
// Wrapped defensively in case it's opened somewhere storage is blocked (private
// browsing, some in-app browsers) — the app still works, it just won't remember
// state across a reload in that case.
const STORAGE_KEY = 'depotline_demo_state_v1';
let storageAvailable = true;
function saveState(){
  if(!storageAvailable) return;
  try{
    const snapshot = {
      depots, fleet, clients, deliveries, invoices, licenses, incidents, tickets,
      activityLog, auditChainTip, seq, currentLang, currentTheme, themeManuallySet, currentRole, currentDriverName, currentCustomerId, suppliers, purchaseOrders, qualityRecords, currentCountryContext, currentClusterContext, externalSupplyLog
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
  }catch(e){ storageAvailable = false; }
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return false;
    const s = JSON.parse(raw);
    depots = s.depots; fleet = s.fleet; clients = s.clients; deliveries = s.deliveries;
    invoices = s.invoices; licenses = s.licenses; incidents = s.incidents; tickets = s.tickets;
    activityLog = s.activityLog || []; auditChainTip = s.auditChainTip || '00000000';
    seq = s.seq || seq;
    currentLang = s.currentLang || 'en';
    currentTheme = s.currentTheme || 'light';
    themeManuallySet = !!s.themeManuallySet;
    currentRole = s.currentRole || 'admin';
    currentDriverName = s.currentDriverName || null;
    currentCustomerId = s.currentCustomerId || null;
    currentCountryContext = s.currentCountryContext || null;
    currentClusterContext = s.currentClusterContext || null;
    suppliers = s.suppliers || suppliers;
    purchaseOrders = s.purchaseOrders || purchaseOrders;
    externalSupplyLog = s.externalSupplyLog || externalSupplyLog;
    qualityRecords = s.qualityRecords || qualityRecords;
    sessionActive = true; // a restored session skips the login wizard, matching "Welcome back"
    return true;
  }catch(e){ storageAvailable = false; return false; }
}
function resetDemoData(){
  try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  location.reload();
}

  const el = document.getElementById('topAlert');
  if(low>0){
    el.style.display='flex';
    el.innerHTML = `${ICONS.alert.replace('width="24" height="24"','width="14" height="14"')} ${low} ${t('statLowStock')}`;
  } else { el.style.display='none'; }
}

/* ============================= NOTIFICATION CENTER ============================= */
let notifPanelOpen = false;
function computeNotifications(){
  const items = [];
  lowStockTanks().forEach(l=>{
    items.push({ icon:'inventory', color:'var(--red)', title:t('notifLowStock',{product:l.tank.product, depot:l.depot.name}), sub:fmt(l.tank.level)+' L', view:'inventory' });
  });
  invoices.filter(i=>invoiceStatusDisplay(i)==='overdue').forEach(i=>{
    const c = clientById(i.client);
    items.push({ icon:'finance', color:'var(--red)', title:t('notifOverdueInvoice',{id:i.id}), sub:(c?c.name:'')+' · '+money(i.amount), view:'finance' });
  });
  licenses.filter(l=>daysUntil(l.expiry)<=30).forEach(l=>{
    items.push({ icon:'compliance', color:'var(--amber)', title:t('notifLicenseExpiring',{name:l.name}), sub:l.expiry, view:'compliance' });
  });
  tickets.filter(tk=>tk.status!=='resolved' && slaStatus(tk)==='breach').forEach(tk=>{
    items.push({ icon:'support', color:'var(--red)', title:t('notifSlaBreach',{id:tk.id}), sub:tk.subject, view:'support' });
  });
  const soon = addDays(TODAY,30);
  clients.filter(c=>c.contractRenewal && c.contractRenewal<=soon).forEach(c=>{
    items.push({ icon:'clients', color:'var(--amber)', title:t('notifContractRenewal',{name:c.name}), sub:c.contractRenewal, view:'clients' });
  });
  return items;
}
function renderNotifPanel(){
  const items = computeNotifications();
  const countEl = document.getElementById('notifCount');
  if(countEl){
    if(items.length>0){ countEl.style.display='flex'; countEl.textContent = items.length>9?'9+':items.length; }
    else countEl.style.display='none';
  }
  const panel = document.getElementById('notifPanel');
  if(!panel) return;
  panel.innerHTML = items.length===0
    ? `<div class="notif-empty">${t('notifEmpty')}</div>`
    : items.map(n=>`
        <div class="notif-item" onclick="goToNotif('${n.view}')">
          <div class="ni-icon" style="background:color-mix(in srgb, ${n.color} 16%, transparent); color:${n.color};">${ICONS[n.icon]}</div>
          <div><div class="ni-title">${n.title}</div><div class="ni-sub">${n.sub}</div></div>
        </div>
      `).join('');
}
function toggleNotifPanel(){
  notifPanelOpen = !notifPanelOpen;
  document.getElementById('notifPanel').classList.toggle('open', notifPanelOpen);
  if(notifPanelOpen) renderNotifPanel();
}
function goToNotif(view){
  notifPanelOpen = false;
  document.getElementById('notifPanel').classList.remove('open');
  goTo(view);
}

/* ============================= GLOBAL SEARCH ============================= */
function toggleMobileSearch(){
  const bar = document.getElementById('mobileSearchBar');
  bar.classList.toggle('open');
  if(bar.classList.contains('open')) document.getElementById('globalSearchMobile').focus();
}
function runGlobalSearch(query){
  const raw = (query||'').trim();
  const q = raw.toLowerCase();
  if(!q) return;
  const d = deliveries.find(x=> x.id.toLowerCase()===q);
  if(d){ goTo('deliveries'); return; }
  const inv = invoices.find(x=> x.id.toLowerCase()===q);
  if(inv){ financeTab='invoices'; goTo('finance'); return; }
  const tk = tickets.find(x=> x.id.toLowerCase()===q);
  if(tk){ goTo('support'); return; }
  const c = clients.find(x=> x.id.toLowerCase()===q || x.name.toLowerCase().includes(q));
  if(c){ searchClients = c.name; goTo('clients'); return; }
  const dPartial = deliveries.find(x=> x.id.toLowerCase().includes(q));
  if(dPartial){ searchDeliveries = raw; goTo('deliveries'); return; }
  showToast(t('toastNoResults'), 'info');
}

function renderAll(){
  if(!sessionActive){ openLoginWizard(); return; }
  applyEscalations();
  renderNav();
  renderTopAlert();
  renderNotifPanel();
  const navItem = NAV.find(n=>n.id===currentView);
  document.getElementById('viewTitle').textContent = navItem ? t(navItem.key) : '';
  const v = document.getElementById('view');
  if(currentView==='dashboard') v.innerHTML = viewDashboard();
  if(currentView==='departments') v.innerHTML = viewDepartments();
  if(currentView==='orgchart') v.innerHTML = viewOrgChart();
  if(currentView==='myaccount') v.innerHTML = viewMyAccount();
  if(currentView==='deliveries') v.innerHTML = viewDeliveries();
  if(currentView==='inventory') v.innerHTML = viewInventory();
  if(currentView==='procurement') v.innerHTML = viewProcurement();
  if(currentView==='fleet') v.innerHTML = viewFleet();
  if(currentView==='reconciliation') v.innerHTML = viewReconciliation();
  if(currentView==='clients') v.innerHTML = viewClients();
  if(currentView==='finance') v.innerHTML = viewFinance();
  if(currentView==='compliance') v.innerHTML = viewCompliance();
  if(currentView==='support') v.innerHTML = viewSupport();
  if(currentView==='executive') v.innerHTML = viewExecutive();
  if(currentView==='reports') v.innerHTML = viewReports();
  if(currentView==='audit') v.innerHTML = viewAuditLog();
  saveState();
}

/* ============================= GAUGE ============================= */
function gaugeHTML(tank, showLoc){
  const p = pct(tank.level, tank.capacity);
  const cls = gaugeClass(p);
  const colorVar = cls==='ok' ? '--green' : cls==='mid' ? '--amber' : '--red';
  return `
    <div class="gauge-wrap">
      <div class="gauge"><div class="gauge-fill ${cls}" style="height:${p}%;"></div></div>
      <div class="gauge-meta">
        <div class="g-name"><span class="prod-dot prod-${tank.product}"></span>${tank.product}</div>
        ${showLoc?`<div class="g-loc">${t('reorderAt',{n:fmt(tank.reorder)})}</div>`:''}
        <div class="g-pct mono" style="color:var(${colorVar})">${p}%</div>
        <div class="g-vol">${fmt(tank.level)} / ${fmt(tank.capacity)} L</div>
      </div>
    </div>
  `;
}

let searchDeliveries = '';
function deliveriesRowsHtml(list){
  return list.map(d=>{
    const c = clientById(d.client);
    const v = d.vehicle ? vehicleById(d.vehicle) : null;
    const isCyl = d.unit==='cylinders';
    const transportCell = d.transportMode==='hired_transporter'
      ? `<span class="transport-hired-tag">${t('hiredTagShort')}</span> ${hiredTransporters.find(h=>h.id===d.hiredTransporterId)?.name || ''}`
      : (v ? v.plate : `<span class="muted">${t('unassigned')}</span>`);
    return `<tr class="clickable-row" onclick="openDeliveryDetail('${d.id}')">
      <td class="id-cell">${d.id}</td>
      <td>${c? c.name : '—'}</td>
      <td><span class="badge ${c?.type}"><span class="badge-dot"></span>${c?.type==='mine'? t('typeIndustrial') : t('typeRetail')}</span></td>
      <td><span class="prod-dot prod-${isCyl?'Gas':d.product}"></span>${isCyl? t('cylinderSizeLabel',{size:d.cylinderSize}) : d.product}</td>
      <td class="mono">${fmt(d.qty)}${isCyl?'':' L'}</td>
      <td>${transportCell}</td>
      <td class="mono">${d.date}</td>
      <td><span class="badge ${d.status}">${statusIconHTML(d.status)}${statusLabel(d.status)}</span></td>
      <td onclick="event.stopPropagation()">${deliveryActionsCell(d)}</td>
    </tr>`;
  }).join('');
}
function openDeliveryDetail(id){
  const d = deliveries.find(x=>x.id===id);
  if(!d) return;
  const c = clientById(d.client);
  const dep = depotById(d.depot);
  const v = d.vehicle ? vehicleById(d.vehicle) : null;
  const isCyl = d.unit==='cylinders';
  const inv = invoices.find(i=>i.delivery===d.id);
  const transportText = d.transportMode==='hired_transporter'
    ? `${t('hiredTagShort')} · ${hiredTransporters.find(h=>h.id===d.hiredTransporterId)?.name || ''}`
    : (v ? `${v.plate} (${v.driver})` : t('unassigned'));
  const html = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h2>${d.id}</h2>
        <div class="h2-sub">${c?c.name:'—'} · ${d.date}</div>
        <div class="detail-box">
          <div class="dc-row"><span class="dc-label">${t('thStatus')}</span><span class="dc-val"><span class="badge ${d.status}">${statusIconHTML(d.status)}${statusLabel(d.status)}</span></span></div>
          <div class="dc-row"><span class="dc-label">${t('thProduct')}</span><span class="dc-val"><span class="prod-dot prod-${isCyl?'Gas':d.product}"></span>${isCyl? t('cylinderSizeLabel',{size:d.cylinderSize}) : d.product}</span></div>
          <div class="dc-row"><span class="dc-label">${t('thVolume')}</span><span class="dc-val mono">${fmt(d.qty)}${isCyl?'':' L'}</span></div>
          ${d.deliveredQty!=null ? `<div class="dc-row"><span class="dc-label">${t('thDeliveredVol')}</span><span class="dc-val mono">${fmt(d.deliveredQty)}${isCyl?'':' L'}</span></div>` : ''}
          <div class="dc-row"><span class="dc-label">${t('thDepotCol')}</span><span class="dc-val">${dep?dep.name:'—'}</span></div>
          <div class="dc-row"><span class="dc-label">${t('thTransport')}</span><span class="dc-val">${transportText}</span></div>
          ${d.lotNumber ? `<div class="dc-row"><span class="dc-label">${t('lotLabel')}</span><span class="dc-val mono">${d.lotNumber}</span></div>` : ''}
          ${d.sealNumber ? `<div class="dc-row"><span class="dc-label">${t('sealLabel')}</span><span class="dc-val mono">${d.sealNumber}</span></div>` : ''}
          ${d.pod ? `<div class="dc-row"><span class="dc-label">${t('podTitle')}</span><span class="dc-val">${t('podConfirmed')}</span></div>` : ''}
          ${inv ? `<div class="dc-row"><span class="dc-label">${t('thInvoice')}</span><span class="dc-val mono">${inv.id} · ${money(inv.amount)}</span></div>` : ''}
          ${d.issueNote ? `<div class="dc-row"><span class="dc-label">${t('btnReportIssue')}</span><span class="dc-val">${d.issueNote}</span></div>` : ''}
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">${t('btnClose')}</button>
          ${(d.status==='dispatched'||d.status==='transit') ? `<button class="btn btn-primary" onclick="closeModal(); openTracking('${d.id}');">${t('btnTrack')}</button>` : ''}
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalRoot').innerHTML = html;
}
function filterDeliveriesList(){
  const q = searchDeliveries.trim().toLowerCase();
  const scoped = visibleDeliveriesList();
  const sorted = [...scoped].sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  if(!q) return sorted;
  return sorted.filter(d=>{
    const c = clientById(d.client); const v = d.vehicle ? vehicleById(d.vehicle) : null;
    return [d.id, c?.name, d.product, v?.plate].some(x=> x && x.toLowerCase().includes(q));
  });
}
function filterDeliveries(val){
  searchDeliveries = val;
  document.getElementById('deliveriesTbody').innerHTML = deliveriesRowsHtml(filterDeliveriesList());
}

          <button class="btn btn-primary" onclick="finalizeDelivery()">${t('podConfirm')}</button>
        </div>
      </div>
    </div>
  `;

function initSignaturePad(){
  const canvas = document.getElementById('podCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--blue') || '#3B82F6';
  ctx.lineWidth = 2.2;
  ctx.lineCap = 'round';
  let drawing = false;
  const pos = (e)=>{
    const r = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - r.left, y: p.clientY - r.top };
  };
  const start = (e)=>{ drawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); };
  const move = (e)=>{
    if(!drawing) return; e.preventDefault();
    const p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke();
    if(!podState.signed){ podState.signed = true; const hint=document.getElementById('podSignedHint'); if(hint) hint.textContent = t('podSigned'); }
  };
  const end = ()=>{ drawing = false; };
  canvas.onmousedown = start; canvas.onmousemove = move; canvas.onmouseup = end; canvas.onmouseleave = end;
  canvas.ontouchstart = start; canvas.ontouchmove = move; canvas.ontouchend = end;
}
function clearSignaturePad(){
  const canvas = document.getElementById('podCanvas');
  if(!canvas) return;
  canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);
  podState.signed = false;
  const hint=document.getElementById('podSignedHint'); if(hint) hint.textContent = t('podSignHint');
}

function finalizeDelivery(){
  const d = deliveries.find(x=>x.id===podState.delId);
  if(!podState.sealVerified){ alert(t('podRequireSeal')); return; }
  if(!podState.signed){ alert(t('podRequireSignature')); return; }
  const isCylinder = d.unit==='cylinders';
  if(isCylinder){
    d.deliveredQty = d.qty; // cylinders are a discrete count — no fractional shrinkage
    d.pod = { signed:true, photo: podState.photo };
    d.status='delivered'; d.deliveredAt = nowTime(); d.progress = 100;
    const v=vehicleById(d.vehicle); if(v) v.status='idle';
    const c=clientById(d.client); if(c) c.delivered += d.deliveredQty;
    const dep = depotById(d.depot);
    const cyl = dep?.cylinders?.find(cy=>cy.size===d.cylinderSize);
    if(cyl) cyl.emptyStock = Math.min(cyl.capacity, cyl.emptyStock + d.qty); // customer's empties returned on exchange
    generateInvoiceForDelivery(d);
    closeModal();
    renderAll();
    showToast(t('toastDelivered',{id:d.id}), 'success');
    logActivity('delivery', t('logDelivered',{id:d.id, qty:fmt(d.deliveredQty)}));
    return;
  }
  const shrinkPct = Math.random() < 0.2 ? (0.03 + Math.random()*0.02) : (Math.random()*0.015);
  d.deliveredQty = Math.max(0, Math.round(d.qty * (1 - shrinkPct)));
  d.pod = { signed:true, photo: podState.photo };
  d.status='delivered'; d.deliveredAt = nowTime(); d.progress = 100;
  const v=vehicleById(d.vehicle); if(v) v.status='idle';
  const c=clientById(d.client); if(c) c.delivered += d.deliveredQty;
  generateInvoiceForDelivery(d);
  closeModal();
  renderAll();
  showToast(t('toastDelivered',{id:d.id}), 'success');
  logActivity('delivery', t('logDelivered',{id:d.id, qty:fmt(d.deliveredQty)}));
}

function createDelivery(){
  if(!canManageDeliveries()){ denyPermission(); return; }
  const client = document.getElementById('f-client').value;
  const depot = document.getElementById('f-depot').value;
  const unit = document.getElementById('f-unit').value;
  const isCylinder = unit==='cylinders';
  const product = isCylinder ? 'Gas Cylinders' : document.getElementById('f-product').value;
  const cylinderSize = isCylinder ? document.getElementById('f-cylinder-size').value : null;
  const qty = parseInt((isCylinder ? document.getElementById('f-cyl-qty').value : document.getElementById('f-qty').value) || '0', 10);
  const date = document.getElementById('f-date').value;
  if(!qty || qty<=0){ alert(t('validVolume')); return; }
  if(!isCylinder){
    const credit = checkCreditBlock(client, qty, product);
    if(credit.blocked){
      const c = clientById(client);
      if(currentRole!=='admin'){
        alert(t('creditBlockedMsg',{name:c.name, projected:money(credit.projected), limit:money(credit.limit)}));
        return;
      }
      if(!confirm(t('creditOverrideConfirm',{name:c.name, projected:money(credit.projected), limit:money(credit.limit)}))) return;
    }
  }
  seq.del++;
  const newId = 'DEL-'+seq.del;
  const channel = deliveryChannelFor(clientById(client));
  deliveries.push({ id:newId, client, product, qty, unit, cylinderSize, channel, deliveredQty:null, status:'pending', vehicle:null, depot, date, progress:0, dispatchedAt:null, transitAt:null, deliveredAt:null, pod:null, lotNumber:null, sealNumber:null, customerRequested:false });
  closeModal();
  renderAll();
  showToast(t('toastOrderCreated',{id:newId}), 'success');
  logActivity('order', t('logOrderCreated',{id:newId}));
}

function recommendVehicle(pool, depotId, qty){
  const fitting = pool.filter(v=> vehicleMaxSingleLoad(v) >= qty);
  if(fitting.length===0) return null;
  // Real, explainable heuristic: prefer the smallest compartment that still fits the
  // order (minimizes wasted capacity on the trip), then prefer the vehicle serviced
  // most recently (lower breakdown risk). No ML — this is transparent, deterministic logic.
  const scored = fitting.map(v=>{
    const bestCompartment = Math.min(...v.compartments.filter(c=>c>=qty));
    const waste = bestCompartment - qty;
    const daysSinceService = Math.round((new Date(TODAY) - new Date(v.lastService)) / 86400000);
    return { v, waste, daysSinceService };
  }).sort((a,b)=> a.waste - b.waste || a.daysSinceService - b.daysSinceService);
  const top = scored[0];
  const reasons = [];
  reasons.push(t('reasonSameDepot'));
  reasons.push(t('reasonCapacityFit',{waste:fmt(top.waste)}));
  reasons.push(t('reasonServiceRecency',{n:top.daysSinceService}));
  return { vehicle: top.v, reasons };
}

function confirmDispatch(delId){
  if(!canManageDeliveries()){ denyPermission(); return; }
  const d = deliveries.find(x=>x.id===delId);
  const dep = depotById(d.depot);
  const isCylinder = d.unit==='cylinders';
  const transportChoice = document.getElementById('f-transport-choice')?.value || 'own';
  const isHired = transportChoice==='hired';

  if(isHired){
    const hiredId = document.getElementById('f-hired-transporter').value;
    const hired = hiredTransporters.find(h=>h.id===hiredId);
    if(isCylinder){
      const cyl = dep?.cylinders?.find(c=>c.size===d.cylinderSize);
      if(cyl && cyl.fullStock < d.qty){
        if(!confirm(t('confirmExceedCylinders',{stock:fmt(cyl.fullStock), size:d.cylinderSize, depot:dep.name}))) return;
      }
      if(cyl) cyl.fullStock = Math.max(0, cyl.fullStock - d.qty);
    } else {
      const tank = dep?.tanks.find(tk=>tk.product===d.product);
      if(tank && tank.qualityHold){
        alert(t('dispatchBlockedQuality',{product:d.product, depot:dep.name}));
        return;
      }
      if(tank && tank.level < d.qty){
        if(!confirm(t('confirmExceed',{level:fmt(tank.level), product:d.product, depot:dep.name}))) return;
      }
      if(tank) tank.level = Math.max(0, tank.level - d.qty);
    }
    d.transportMode = 'hired_transporter';
    d.hiredTransporterId = hiredId;
    d.hiredTripCost = hired ? hired.ratePerTrip : null;
    d.vehicle = null;
    d.aiRecommendedFollowed = null;
    d.status = 'dispatched';
    d.dispatchedAt = nowTime();
    d.progress = 8;
    d.lotNumber = 'LOT-'+d.depot+'-'+d.date.replace(/-/g,'')+'-'+(isCylinder?'CYL':d.product.slice(0,3).toUpperCase());
    d.sealNumber = 'SEAL-'+Math.floor(10000+Math.random()*89999);
    closeModal();
    renderAll();
    showToast(t('toastDispatchedHired',{id:delId, name:hired?hired.name:''}), 'success');
    logActivity('dispatch', t('logDispatchedHired',{id:delId, name:hired?hired.name:''}));
    return;
  }

  const vehId = document.getElementById('f-vehicle').value;
  const veh = vehicleById(vehId);
  d.transportMode = 'own_fleet';
  d.hiredTransporterId = null;
  d.hiredTripCost = null;

  if(isCylinder){
    const cyl = dep?.cylinders?.find(c=>c.size===d.cylinderSize);
    if(cyl && cyl.fullStock < d.qty){
      if(!confirm(t('confirmExceedCylinders',{stock:fmt(cyl.fullStock), size:d.cylinderSize, depot:dep.name}))) return;
    }
    d.vehicle = vehId;
    d.status = 'dispatched';
    d.dispatchedAt = nowTime();
    d.progress = 8;
    d.lotNumber = 'LOT-'+d.depot+'-'+d.date.replace(/-/g,'')+'-CYL';
    d.sealNumber = 'SEAL-'+Math.floor(10000+Math.random()*89999);
    veh.status = 'enroute';
    if(cyl) cyl.fullStock = Math.max(0, cyl.fullStock - d.qty);
    closeModal();
    renderAll();
    showToast(t('toastDispatched',{id:delId}), 'success');
    logActivity('dispatch', t('logDispatched',{id:delId, vehicle:veh.plate}));
    return;
  }

  if(vehicleMaxSingleLoad(veh) < d.qty){
    alert(t('compartmentTooSmall'));
    return;
  }
  const tank = dep?.tanks.find(tk=>tk.product===d.product);
  if(tank && tank.qualityHold){
    alert(t('dispatchBlockedQuality',{product:d.product, depot:dep.name}));
    return;
  }
  if(tank && tank.level < d.qty){
    if(!confirm(t('confirmExceed',{level:fmt(tank.level), product:d.product, depot:dep.name}))) return;
  }
  const eligibleNow = fleet.filter(v=> v.status==='idle' && v.depot===d.depot && vehicleMaxSingleLoad(v)>=d.qty);
  const recNow = eligibleNow.length ? recommendVehicle(eligibleNow, d.depot, d.qty) : null;
  d.aiRecommendedFollowed = recNow ? (recNow.vehicle.id === vehId) : null;
  d.vehicle = vehId;
  d.status = 'dispatched';
  d.dispatchedAt = nowTime();
  d.progress = 8;
  d.lotNumber = 'LOT-'+d.depot+'-'+d.date.replace(/-/g,'')+'-'+d.product.slice(0,3).toUpperCase();
  d.sealNumber = 'SEAL-'+Math.floor(10000+Math.random()*89999);
  veh.status = 'enroute';
  if(tank) tank.level = Math.max(0, tank.level - d.qty);
  closeModal();
  renderAll();
  showToast(t('toastDispatched',{id:delId}), 'success');
  logActivity('dispatch', t('logDispatched',{id:delId, vehicle:veh.plate}));
}

function trackingSteps(d){
  return [
    { label:t('stepOrderPlaced'), done:true, time:d.date },
    { label:t('stepDispatched'), done:['dispatched','transit','delivered'].includes(d.status), time:d.dispatchedAt || '—' },
    { label:t('stepTransit'), done:['transit','delivered'].includes(d.status), time:d.transitAt || '—' },
    { label:t('stepDelivered'), done:d.status==='delivered', time:d.deliveredAt || '—' },
  ];
}

function openTracking(delId){
  trackingDelId = delId;
  document.getElementById('modalRoot').innerHTML = renderTrackingModal(delId);
}

function renderTrackingModal(delId){
  const d = deliveries.find(x=>x.id===delId);
  if(!d) return '';
  const c = clientById(d.client);
  const v = d.vehicle ? vehicleById(d.vehicle) : null;
  const dep = depotById(d.depot);
  const steps = trackingSteps(d);
  const activeIdx = steps.reduce((acc,s,i)=> s.done ? i : acc, 0);
  const progress = Math.round(d.progress||0);
  const remaining = 100 - progress;
  const etaMin = Math.max(1, Math.round(remaining/5));
  const etaText = d.status==='delivered' ? t('etaArrived') : (d.status==='pending' ? t('etaAwaiting') : t('etaMinutes',{n:etaMin}));

  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal wide">
        <h2>${t('modalTrackingTitle')}</h2>
        <div class="track-head">
          <div>
            <div style="font-size:15px; font-weight:700;">${d.id} · ${c?.name || '—'}</div>
            <div class="track-route">${dep?.name || '—'} → ${c?.location || '—'} ${d.transportMode==='hired_transporter' ? '· '+t('hiredTagShort')+' '+(hiredTransporters.find(h=>h.id===d.hiredTransporterId)?.name||'') : (v? '· '+v.plate+' ('+v.driver+')' : '')}</div>
            ${d.sealNumber ? `<div class="track-route mono">${t('sealLabel')}: ${d.sealNumber} ${d.lotNumber? ' · '+t('lotLabel')+': '+d.lotNumber : ''}</div>` : ''}
          </div>
          <div class="track-eta">
            <div class="te-label">${t('etaLabel')}</div>
            <div class="te-val" id="trackEtaVal">${etaText}</div>
          </div>
        </div>
        <div class="progress-track"><div class="progress-fill" id="trackProgressFill" style="width:${progress}%;"></div></div>
        <div class="timeline">
          ${steps.map((s,i)=>`
            <div class="t-step ${s.done? (i===activeIdx && d.status!=='delivered' ? 'active':'done') : ''}">
              <div class="t-dot"></div>
              <div>
                <div class="t-label">${s.label}</div>
                <div class="t-time">${s.time}</div>
              </div>
            </div>
          `).join('')}
        </div>
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="closeModal()">${t('btnClose')}</button>
        </div>
      </div>
    </div>
  `;
}

function refreshTracking(){
  let anyMoved = false;
  deliveries.filter(d=>d.status==='transit').forEach(d=>{

  if(currentView==='dashboard') document.getElementById('view').innerHTML = viewDashboard();

function submitCylinderRefillPO(){
  if(!canManageProcurement()){ denyPermission(); return; }

  const cylinderSize = document.getElementById('f-refill-size').value;
  const qty = parseInt(document.getElementById('f-refill-qty').value||'0',10);

  const supplier = (compatibleSuppliers[0] || suppliers[0]).id;
  purchaseOrders.push({

function submitNewPO(defaultDepotId){
  if(!canManageProcurement()){ denyPermission(); return; }
  const supplier = document.getElementById('f-po-supplier').value;
  const depot = document.getElementById('f-po-depot').value;
  const product = document.getElementById('f-po-product').value;
  const qty = parseInt(document.getElementById('f-po-qty').value||'0',10);
  const unitCost = parseFloat(document.getElementById('f-po-cost').value||'1');
  if(!qty || qty<=0){ alert(t('validVolume')); return; }
  const transportMode = document.getElementById('f-po-transport')?.value || 'truck_owned';
  const id = createPurchaseOrder(supplier, depot, product, qty, unitCost, window.PO_FROM_FORECAST);
  const po = purchaseOrders.find(p=>p.id===id);
  po.transportMode = transportMode;
  if(transportMode==='truck_hired') po.hiredTransporterId = document.getElementById('f-po-hired')?.value || null;
  if(transportMode==='rail'){
    po.railWagons = parseInt(document.getElementById('f-po-wagons')?.value||'0',10);
    po.trainRef = document.getElementById('f-po-trainref')?.value || '';
  }
  if(transportMode==='pipeline'){
    po.pipelineOperator = PIPELINE_OPERATORS[countryOf(depotById(depot).location)] || '';
    po.nominationWindow = document.getElementById('f-po-nomination')?.value || '';
  }
  window.PO_FROM_FORECAST = false;
  closeModal();
  renderAll();
  showToast(t('toastPoCreated',{id}), 'success');
}

/* ---- Fuel Logs (Phase 1 completion) ---- */
function viewFuelLogs(){
  const fleet = visibleFleetList();
  const deliveries = visibleDeliveriesList();
  const perVehicle = fleet.map(v=>{
    const trips = deliveries.filter(d=> d.vehicle===v.id && d.status==='delivered')
      .sort((a,b)=> b.date.localeCompare(a.date));
    const totalQty = trips.reduce((s,d)=> s + (d.deliveredQty!=null? d.deliveredQty : d.qty), 0);
    const avg = trips.length ? totalQty / trips.length : 0;
    return { v, trips, totalQty, avg };
  }).filter(x=> x.trips.length > 0);
  const fleetAvg = perVehicle.length ? perVehicle.reduce((s,x)=>s+x.avg,0)/perVehicle.length : 0;

  return `
    <div class="muted" style="margin-bottom:16px;">${t('fuelLogsSubtitle')}</div>
    ${perVehicle.map(({v,trips,totalQty,avg})=>{
      const deviation = fleetAvg ? ((avg - fleetAvg)/fleetAvg)*100 : 0;
      const flagged = Math.abs(deviation) > 25;
      return `
        <div class="card" style="margin-bottom:14px;">
          <div class="flex-between" style="margin-bottom:10px;">
            <div>
              <div style="font-weight:700; font-family:'Manrope',sans-serif;">${v.plate} · ${v.driver}</div>
              <div class="muted">${depotById(v.depot)?.name || '—'}</div>
            </div>
            <div style="text-align:right;">
              <div class="mono" style="font-weight:700;">${fmt(Math.round(totalQty))} L</div>
              <div class="${flagged?'sla-tag breach':'muted'}" style="font-size:11px;">
                ${flagged? t('fuelLogFlag',{n:Math.round(Math.abs(deviation))}) : t('fuelLogNormal')}
              </div>
            </div>
          </div>
          ${trips.slice(0,4).map(d=>`
            <div class="list-row">
              <div>
                <div class="lr-main">${d.id} · ${clientById(d.client)?.name || '—'}</div>
                <div class="lr-sub">${d.date}</div>
              </div>
              <div class="mono">${fmt(d.deliveredQty!=null? d.deliveredQty : d.qty)} L</div>
            </div>
          `).join('')}
        </div>
      `;
    }).join('')}
  `;
}

function submitExternalSupply(){
  const clientId = document.getElementById('f-ext-client').value;
  const product = document.getElementById('f-ext-product').value;
  const qty = parseInt(document.getElementById('f-ext-qty').value||'0',10);
  const date = document.getElementById('f-ext-date').value;
  const supplierName = document.getElementById('f-ext-supplier').value.trim();
  const note = document.getElementById('f-ext-note').value.trim();
  if(!qty || qty<=0){ alert(t('validVolume')); return; }
  if(!supplierName){ alert(t('validSupplierName')); return; }
  seq.ext = (seq.ext||0) + 1;
  const id = 'EXT-'+String(seq.ext).padStart(3,'0');
  externalSupplyLog.push({ id, client:clientId, product, qty, date, supplierName, note });
  closeModal();
  openClientDetail(clientId); // reopen refreshed so the new entry is visible immediately
  showToast(t('toastExternalLogged',{qty:fmt(qty)}), 'success');
  logActivity('order', t('logExternalLogged',{client:clientById(clientId)?.name||clientId, qty:fmt(qty)}));
}

function agingBuckets(){
  const buckets = { current:[], b30:[], b60:[], b90:[], b90plus:[] };
  const nowD = new Date(TODAY+'T00:00:00');
  visibleInvoicesList().filter(i=> i.status!=='paid').forEach(i=>{
    const due = new Date(i.dueDate+'T00:00:00');
    const daysPast = Math.round((nowD - due) / 86400000);
    if(daysPast <= 0) buckets.current.push(i);
    else if(daysPast <= 30) buckets.b30.push(i);
    else if(daysPast <= 60) buckets.b60.push(i);
    else if(daysPast <= 90) buckets.b90.push(i);
    else buckets.b90plus.push(i);
  });
  return buckets;
}
